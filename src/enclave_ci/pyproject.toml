[project]
name = "enclave-ci"
version = "0.1.0"
description = "Red Hat Sovereign Enclave CI tooling (not shipped to clients)"
requires-python = "==3.12.*"
# libvirt-python is deliberately not listed: PyPI ships it as an sdist only, so
# installing it would compile it (gcc, libvirt-devel). The libvirt bindings come
# from the host's python3-libvirt RPM instead, which requires running enclave-ci
# from a venv created on the host python3 with --system-site-packages.
dependencies = [
    "certbot ==5.8.0",
    "certbot-dns-hetzner ==4.0.0",
    "click ==8.5.1",
    "cryptography ==50.0.2",
    "jinja2 ==3.1.6",
    "pyyaml ==6.0.3",
    "requests ==2.34.2",
]

[project.scripts]
enclave-ci = "enclave_ci.cli:cli"

[build-system]
requires = ["hatchling ==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["enclave_ci"]
