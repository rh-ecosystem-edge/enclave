[project]
name = "enclave-ci"
version = "0.1.0"
description = "Red Hat Sovereign Enclave CI tooling (not shipped to clients)"
requires-python = "==3.12.*"
dependencies = [
    "certbot ==5.8.0",
    "certbot-dns-hetzner ==4.0.0",
    "click ==8.5.0",
    "cryptography ==50.0.2",
    "jinja2 ==3.1.6",
    "pyyaml ==6.0.3",
    "requests ==2.34.2",
]

[project.scripts]
enclave-ci = "enclave_ci.cli:cli"

[build-system]
requires = ["hatchling ==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["enclave_ci"]
