---
# Quay disconnected: prepare and optionally apply IDMS/ITMS from oc-mirror, trust the
# Quay registry CA for image pulls, wait for the resulting MCO rollout, then restart the
# UpdateService if the CA changed. On LVMS the UpdateService runs one replica during the
# rollout so its PodDisruptionBudget cannot block the drains.
# Included from quay_disconnected_finish.yaml and mirror_plugin.yaml.
#
# Copy to a target manifest name based on mode:
# - default: idms-<slice>-internal (core); plugin mode: quay_mirror_suffix is plugin-<plugin>-internal
#   → idms-<slice>-plugin-<plugin>-internal (oc-mirror may emit multiple slices per file; keep \2 in the name).
# LZ plugin manifests use idms-<slice>-plugin-<plugin> (mirror_plugin.yaml).
#
# Set quay_mirror_skip_apply: true to prepare manifests without applying them (mirror_plugin.yaml
# batches all applies to trigger a single MCO rollout).

- name: Set target mirror suffix and base directory
  ansible.builtin.set_fact:
    quay_mirror_suffix: >-
      {{
        ('plugin-' ~ plugin_name ~ '-internal')
        if (plugin_mirror | default(false) | bool)
        else 'internal'
      }}
    quay_cluster_resources_dir: "{{ workingDir }}/config/oc-mirror-workspace-quay/working-dir/cluster-resources"

- name: Set target mirror manifest paths
  ansible.builtin.set_fact:
    quay_idms_internal_manifest: "{{ quay_cluster_resources_dir }}/idms-oc-mirror-{{ quay_mirror_suffix }}.yaml"
    quay_itms_internal_manifest: "{{ quay_cluster_resources_dir }}/itms-oc-mirror-{{ quay_mirror_suffix }}.yaml"

- name: Stat IDMS source from oc-mirror workspace
  ansible.builtin.stat:
    path: "{{ workingDir }}/config/oc-mirror-workspace-quay/working-dir/cluster-resources/idms-oc-mirror.yaml"
  register: quay_idms_src_stat

- name: Copy IDMS to target mirror manifest
  ansible.builtin.copy:
    src: "{{ workingDir }}/config/oc-mirror-workspace-quay/working-dir/cluster-resources/idms-oc-mirror.yaml"
    dest: "{{ quay_idms_internal_manifest }}"
    remote_src: true
  when: quay_idms_src_stat.stat.exists

# oc-mirror v2 uses names like idms-release-0, idms-operator-0 (not idms-oc-mirror); multiple docs per file are normal.
- name: Rename ImageDigestMirrorSet resources in IDMS manifest (suffix per mode)
  ansible.builtin.replace:
    path: "{{ quay_idms_internal_manifest }}"
    regexp: '^(\s*name:\s*)idms-([^\s]+)\s*$'
    replace: '\1idms-\2-{{ quay_mirror_suffix }}'
  when: quay_idms_src_stat.stat.exists

- name: Stat ITMS source from oc-mirror workspace
  ansible.builtin.stat:
    path: "{{ workingDir }}/config/oc-mirror-workspace-quay/working-dir/cluster-resources/itms-oc-mirror.yaml"
  register: quay_itms_src_stat

- name: Copy ITMS to target mirror manifest
  ansible.builtin.copy:
    src: "{{ workingDir }}/config/oc-mirror-workspace-quay/working-dir/cluster-resources/itms-oc-mirror.yaml"
    dest: "{{ quay_itms_internal_manifest }}"
    remote_src: true
  when: quay_itms_src_stat.stat.exists

# oc-mirror v2 uses names like itms-release-0, itms-operator-0; multiple docs per file are normal.
- name: Rename ImageTagMirrorSet resources in ITMS manifest (suffix per mode)
  ansible.builtin.replace:
    path: "{{ quay_itms_internal_manifest }}"
    regexp: '^(\s*name:\s*)itms-([^\s]+)\s*$'
    replace: '\1itms-\2-{{ quay_mirror_suffix }}'
  when: quay_itms_src_stat.stat.exists

- name: Set IDMS apply manifest path
  ansible.builtin.set_fact:
    quay_idms_apply_manifest: "{{ quay_idms_internal_manifest }}"
  when: quay_idms_src_stat.stat.exists

- name: Set ITMS apply manifest path
  ansible.builtin.set_fact:
    quay_itms_apply_manifest: "{{ quay_itms_internal_manifest }}"
  when: quay_itms_src_stat.stat.exists

# On LVMS, keep the UpdateService's PodDisruptionBudget from deadlocking the rollout's
# drains (see updateservice_mirror_rollout_guard.yaml); restored after the wait.
- name: Lower the UpdateService for the mirror rollout
  ansible.builtin.include_tasks: ../../playbooks/tasks/updateservice_mirror_rollout_guard.yaml
  vars:
    updateservice_guard: lower
  when:
    - not (quay_mirror_skip_apply | default(false) | bool)
    - storage_plugin | default('') == 'lvms'

- name: Apply Quay IDMS to cluster (fallback mirrors to internal Quay)
  ansible.builtin.command:
    argv:
      - "{{ workingDir }}/bin/oc"
      - apply
      - -f
      - "{{ quay_idms_apply_manifest }}"
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_quay_idms_apply
  changed_when: r_quay_idms_apply.stdout_lines | reject('search', ' unchanged$') | list | length > 0
  when:
    - quay_idms_src_stat.stat.exists
    - not (quay_mirror_skip_apply | default(false) | bool)

- name: Apply Quay ITMS to cluster (fallback mirrors to internal Quay)
  ansible.builtin.command:
    argv:
      - "{{ workingDir }}/bin/oc"
      - apply
      - -f
      - "{{ quay_itms_apply_manifest }}"
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_quay_itms_apply
  changed_when: r_quay_itms_apply.stdout_lines | reject('search', ' unchanged$') | list | length > 0
  when:
    - quay_itms_src_stat.stat.exists
    - not (quay_mirror_skip_apply | default(false) | bool)

- name: Trust Quay registry CA in image.config for image pulls
  ansible.builtin.include_tasks: ../../playbooks/tasks/trust_quay_registry_ca_for_image_config.yaml
  vars:
    quay_ca_defer_updateservice_restart: true

# Applied mirrors trigger a MachineConfig rollout; wait for it before the next phases,
# and for one an interrupted earlier run left unfinished: a non-paused pool still Updating
# or not yet Updated (wait_mcp.yaml's "busy" rule; a pool without spec.paused counts as not
# paused). If the pools cannot be read, that counts as pending so the wait reports it.
# Plugin mode (quay_mirror_skip_apply) skips this: mirror_plugin.yaml waits once itself.
- name: Check for an unfinished MachineConfigPool rollout
  ansible.builtin.command:
    argv: ["{{ workingDir }}/bin/oc", get, mcp, -o, json, --request-timeout=30s]
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_mcp_pending
  changed_when: false
  failed_when: false
  timeout: 120
  when: not (quay_mirror_skip_apply | default(false) | bool)

- name: Set MCP rollout pending fact
  when: not (quay_mirror_skip_apply | default(false) | bool)
  vars:
    _pools: "{{ (r_mcp_pending.stdout | from_json)['items'] if r_mcp_pending.rc | default(1) == 0 else [] }}"
    _conditions: >-
      {{
        ((_pools | rejectattr('spec.paused', 'defined') | list)
          + (_pools | selectattr('spec.paused', 'defined') | rejectattr('spec.paused') | list))
        | selectattr('status.conditions', 'defined')
        | map(attribute='status.conditions')
        | flatten
      }}
  ansible.builtin.set_fact:
    mcp_rollout_pending: >-
      {{
        (r_mcp_pending.rc | default(1) != 0)
        or
        (_conditions | selectattr('type', 'equalto', 'Updating')
          | selectattr('status', 'equalto', 'True') | list | length > 0)
        or
        (_conditions | selectattr('type', 'equalto', 'Updated')
          | rejectattr('status', 'equalto', 'True') | list | length > 0)
      }}

- name: Wait for MachineConfigPools to roll out the Quay mirrors
  ansible.builtin.include_tasks: ../../playbooks/tasks/wait_mcp.yaml
  when:
    - not (quay_mirror_skip_apply | default(false) | bool)
    - >-
      (r_quay_idms_apply is changed) or (r_quay_itms_apply is changed)
      or (r_quay_ca_configmap is changed) or (r_quay_ca_existing_configmap is changed)
      or (r_quay_ca_image_config is changed) or (mcp_rollout_pending | default(false) | bool)

- name: Restore the UpdateService after the mirror rollout
  ansible.builtin.include_tasks: ../../playbooks/tasks/updateservice_mirror_rollout_guard.yaml
  vars:
    updateservice_guard: restore
  when:
    - not (quay_mirror_skip_apply | default(false) | bool)
    - storage_plugin | default('') == 'lvms'

# Restart the UpdateService (only if the CA changed) once the rollout has settled, so its
# new replicas start on a quiet cluster with the hub Quay up. Plugin mode: mirror_plugin.yaml
# restarts it after its own wait.
- name: Restart UpdateService deployment to reload registry CA trust
  ansible.builtin.include_tasks: ../../playbooks/tasks/restart_updateservice_for_ca.yaml
  when: not (quay_mirror_skip_apply | default(false) | bool)
