# Detect whether the Quay OAuth application was already configured on a previous
# run. When quay-oauth-credentials exists, the organization, OAuth app and its
# long-lived token are already in place, so the one-time setup below must be
# skipped: the initial user token used to create them expires (~2.5h) and reusing
# it on a re-run fails, while re-creating the app would mint duplicate apps with
# rotating client_id/client_secret.
- name: Check if Quay OAuth application is already configured
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: quay-oauth-credentials
    namespace: quay-enterprise
  register: r_quay_oauth_existing

# Create/update quay-config Secret. On first run the whitelist is empty and gets
# populated by oauth_setup.yaml; on re-runs it is preserved from the existing
# OAuth credentials so the rendered config stays byte-identical and does not
# trigger a spurious quay-app rollout.
# oauth_client_ids is set as a task-scoped var (not a set_fact) on purpose: a
# host fact would outrank the task-scoped override oauth_setup.yaml uses to
# populate the whitelist on first run, leaving it empty and breaking the OAuth
# token grant.
- name: Create or update quay-config Secret
  no_log: true
  vars:
    oauth_client_ids: >-
      {{ [r_quay_oauth_existing.resources[0].data['client-id'] | b64decode]
         if ((quayOAuthApp.enabled | default(true))
             and (r_quay_oauth_existing.resources | default([]) | length > 0))
         else [] }}
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'templates/quay-config-secret.yaml.j2') | from_yaml }}"
  register: r_quay_config_secret
  retries: "{{ k8s_retries }}"
  delay: "{{ k8s_delay }}"
  until: r_quay_config_secret is success

- name: Run storage plugin Quay tasks
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../plugins/{{ storage_plugin }}/tasks/quay.yaml"
  when: lookup('ansible.builtin.fileglob', playbook_dir ~ '/../plugins/' ~ storage_plugin ~ '/tasks/quay.yaml') | length > 0

- name: Wait for QuayRegistry to be available
  kubernetes.core.k8s_info:
    api_version: quay.redhat.com/v1
    kind: QuayRegistry
    name: registry
    namespace: quay-enterprise
  register: quay_registry
  retries: 60
  delay: 10
  until:
    - quay_registry.resources is defined
    - quay_registry.resources | length > 0
    - quay_registry.resources[0].status.conditions is defined
    - quay_registry.resources[0].status.conditions | selectattr('type', 'equalto', 'Available') | selectattr('status', 'equalto', 'True') | list | length > 0


- name: Create user
  no_log: true
  ansible.builtin.uri:
    url: "https://registry-quay-quay-enterprise.apps.{{ clusterName }}.{{ baseDomain }}/api/v1/user/initialize"
    method: POST
    headers:
      Content-Type: application/json
    validate_certs: false
    return_content: yes
    status_code:
      - 200
      - 400
    body_format: json
    body:
      username: "{{ quayUser }}"
      password: "{{ quayPassword }}"
      email: "ecoeng-sovereign-cloud@redhat.com"
      access_token: true
  register: r_quay_user
  retries: 10
  delay: 30
  when: r_quay_oauth_existing.resources | default([]) | length == 0
  until:
    - r_quay_user is defined
    - r_quay_user.status | default(0) == 200 or r_quay_user.json.message | default("") == "Cannot initialize user in a non-empty database"

- name: Extract initial user access token from initialize response
  no_log: true
  ansible.builtin.set_fact:
    quay_initial_token: "{{ r_quay_user.json.access_token }}"
  when:
    - r_quay_oauth_existing.resources | default([]) | length == 0
    - r_quay_user.status | default(0) == 200
    - r_quay_user.json.access_token is defined
    - r_quay_user.json.access_token | length > 0

- name: Store initial user token in Kubernetes Secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: quay-initial-user-token
        namespace: quay-enterprise
        labels:
          app: quay
          component: initial-user
      type: Opaque
      stringData:
        username: "{{ quayUser }}"
        access-token: "{{ quay_initial_token }}"
  when:
    - r_quay_oauth_existing.resources | default([]) | length == 0
    - quay_initial_token is defined
    - quay_initial_token | length > 0
  register: r_quay_initial_user_secret
  retries: "{{ k8s_retries }}"
  delay: "{{ k8s_delay }}"
  until: r_quay_initial_user_secret is success

- name: Read stored initial user token Secret
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: quay-initial-user-token
    namespace: quay-enterprise
  register: r_quay_initial_user_secret_info
  when:
    - r_quay_oauth_existing.resources | default([]) | length == 0
    - quay_initial_token is not defined or quay_initial_token | length == 0

- name: Extract initial user access token from Kubernetes Secret
  no_log: true
  ansible.builtin.set_fact:
    quay_initial_token: "{{ r_quay_initial_user_secret_info.resources[0].data['access-token'] | b64decode }}"
  when:
    - r_quay_oauth_existing.resources | default([]) | length == 0
    - quay_initial_token is not defined or quay_initial_token | length == 0
    - r_quay_initial_user_secret_info.resources is defined
    - r_quay_initial_user_secret_info.resources | length > 0
    - r_quay_initial_user_secret_info.resources[0].data is defined
    - r_quay_initial_user_secret_info.resources[0].data['access-token'] is defined

# Configure OAuth application (organization, app, token generation).
# Skipped once quay-oauth-credentials exists: the OAuth app and its long-lived
# token are already provisioned, and the initial user token needed here has since
# expired. This is extracted to a separate file for better maintainability.
- name: Configure OAuth application for Quay
  ansible.builtin.include_tasks:
    file: oauth_setup.yaml
  when:
    - r_quay_oauth_existing.resources | default([]) | length == 0
    - quayOAuthApp.enabled | default(true)
    - quay_initial_token is defined
    - quay_initial_token | length > 0

- name: Generate pull secret for internal mirror
  no_log: true
  ansible.builtin.set_fact:
    pullSecretQuay: >-
      {"auths":{
      "{{ quayHostname }}:8443":{"auth":"{{ (quayUser + ":" + quayPassword) | ansible.builtin.b64encode }}"},
      "registry-quay-quay-enterprise.apps.{{ clusterName }}.{{ baseDomain }}":
      {"auth":"{{ (quayUser + ":" + quayPassword) | ansible.builtin.b64encode }}"}
      }}

- name: Combine pull secrets for connected mode
  no_log: true
  when: not (disconnected | default(true) | bool)
  ansible.builtin.set_fact:
    pullSecretNew: "{{ pullSecret | ansible.builtin.combine(pullSecretQuay | from_json, recursive=true) }}"

- name: Set pull secret for disconnected (no combine)
  no_log: true
  when: disconnected | default(true) | bool
  ansible.builtin.set_fact:
    pullSecretNew: "{{ pullSecretQuay | from_json }}"

- name: Patch cluster pull-secret
  no_log: true
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pull-secret
        namespace: openshift-config
      stringData:
        .dockerconfigjson: "{{ pullSecretNew | to_json }}"
      type: kubernetes.io/dockerconfigjson
  register: r_patch_cluster_pullsecret
  retries: "{{ k8s_retries }}"
  delay: "{{ k8s_delay }}"
  until: r_patch_cluster_pullsecret is success

- name: Create pull-secret file with the combination
  no_log: true
  ansible.builtin.copy:
    content: "{{ pullSecretQuay }}"
    dest: "{{ workingDir }}/config/pull-secret.quay.json"

- name: Quay disconnected (oc-mirror setup and run)
  when: disconnected | default(true) | bool
  ansible.builtin.include_tasks:
    file: quay_disconnected_start.yaml

- name: Clair validations
  ansible.builtin.include_tasks:
    file: clair_validations.yaml
