---
- name: Get the name of the first Clair pod
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: quay-enterprise
    label_selectors:
      - quay-component=clair-app
  register: clair_pods

- name: Set clair pod name fact
  ansible.builtin.set_fact:
    clair_pod_name: "{{ clair_pods.resources[0].metadata.name }}"

- name: Check for repository-to-cpe.json in the pod
  kubernetes.core.k8s_exec:
    namespace: quay-enterprise
    pod: "{{ clair_pod_name }}"
    command: ls /data/repository-to-cpe.json
  register: cpe_file_check
  ignore_errors: true

- name: "[debug] k8s_exec result for repository-to-cpe.json"
  ansible.builtin.debug:
    var: cpe_file_check

- name: "[debug] k8s_exec traceback for repository-to-cpe.json"
  ansible.builtin.debug:
    msg: "{{ cpe_file_check.exception }}"
  when: cpe_file_check.exception is defined

- name: Check for container-name-repos-map.json in the pod
  kubernetes.core.k8s_exec:
    namespace: quay-enterprise
    pod: "{{ clair_pod_name }}"
    command: ls /data/container-name-repos-map.json
  register: repo_map_check
  ignore_errors: true

- name: "[debug] k8s_exec result for container-name-repos-map.json"
  ansible.builtin.debug:
    var: repo_map_check

- name: "[debug] k8s_exec traceback for container-name-repos-map.json"
  ansible.builtin.debug:
    msg: "{{ repo_map_check.exception }}"
  when: repo_map_check.exception is defined

- name: Fail if files are missing or k8s_exec raised an exception
  ansible.builtin.fail:
    msg: "CPE file check failed — see [debug] tasks above for traceback or rc"
  when: >-
    (cpe_file_check is failed)
    or (cpe_file_check.rc | default(-1) | int != 0)
    or (repo_map_check is failed)
    or (repo_map_check.rc | default(-1) | int != 0)

- name: Get Secrets owned by the Quay registry
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: quay-enterprise
    label_selectors:
      - quay-operator/quayregistry=registry
  register: quay_registry_secrets

- name: Find the Clair postgres config Secret
  ansible.builtin.set_fact:
    clair_postgres_config_secret: "{{ quay_registry_secrets.resources | selectattr('metadata.name', 'match', 'registry-clairpostgres-config-secret') | list }}"

- name: Fail if Clair postgres config Secret is missing
  ansible.builtin.assert:
    that:
      - clair_postgres_config_secret | length > 0
    fail_msg: >-
      Validation Failed: no Secret with label quay-operator/quayregistry=registry
      and a name starting with 'registry-clairpostgres-config-secret' was found
      in namespace quay-enterprise.
    success_msg: >-
      Validation Passed: Clair postgres config Secret
      ({{ clair_postgres_config_secret[0].metadata.name
      if clair_postgres_config_secret | length > 0 else 'unknown' }})
      is present in namespace quay-enterprise.
