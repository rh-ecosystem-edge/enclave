---
# Configure MultiClusterHub with MCE and OADP subscription specs annotation.
# This ensures ACM respects Manual installPlanApproval for MCE and OADP subscriptions.
# Can be used for both initial creation and patching existing MCH during upgrades.

- name: Check for stable core operator CatalogSource
  when: disconnected | default(true) | bool
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: CatalogSource
    name: "cs-{{ mirror_rh_operator_catalog }}"
    namespace: openshift-marketplace
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_stable_core_catalog_source

- name: Check for legacy core operator CatalogSource
  when: disconnected | default(true) | bool
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: CatalogSource
    name: "cs-{{ mirror_rh_operator_catalog }}-v4-20"
    namespace: openshift-marketplace
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_legacy_core_catalog_source

- name: Check for versioned core operator CatalogSource
  when: disconnected | default(true) | bool
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: CatalogSource
    name: "cs-{{ mirror_rh_operator_catalog }}-v{{ mgmt_openshift_version.split('.')[:2] | join('-') }}"
    namespace: openshift-marketplace
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_versioned_core_catalog_source

- name: Select core operator CatalogSource for disconnected MCE and OADP
  when: disconnected | default(true) | bool
  ansible.builtin.set_fact:
    _core_operator_catalog_source: >-
      {{ 'cs-' ~ mirror_rh_operator_catalog
         if r_stable_core_catalog_source.resources | default([]) | length > 0 and
            (((r_stable_core_catalog_source.resources[0].status | default({}, true))
              .connectionState | default({}, true)).lastObservedState | default('', true)) == 'READY'
         else 'cs-' ~ mirror_rh_operator_catalog ~ '-v4-20'
         if r_legacy_core_catalog_source.resources | default([]) | length > 0 and
            (((r_legacy_core_catalog_source.resources[0].status | default({}, true))
              .connectionState | default({}, true)).lastObservedState | default('', true)) == 'READY'
         else 'cs-' ~ mirror_rh_operator_catalog ~ '-v' ~ (mgmt_openshift_version.split('.')[:2] | join('-'))
         if r_versioned_core_catalog_source.resources | default([]) | length > 0 and
            (((r_versioned_core_catalog_source.resources[0].status | default({}, true))
              .connectionState | default({}, true)).lastObservedState | default('', true)) == 'READY'
         else '' }}

- name: Require a ready core operator CatalogSource for disconnected MCE and OADP
  ansible.builtin.assert:
    that:
      - _core_operator_catalog_source | length > 0
    fail_msg: >-
      No ready stable, legacy, or versioned Red Hat operator CatalogSource is
      available in openshift-marketplace for MCE and OADP.
  when: disconnected | default(true) | bool

- name: Set MCE subscription spec for disconnected
  when: disconnected | default(true) | bool
  ansible.builtin.set_fact:
    mce_subscription_spec:
      installPlanApproval: Manual
      source: "{{ _core_operator_catalog_source }}"

- name: Set MCE subscription spec for connected
  when: not (disconnected | default(true) | bool)
  vars:
    _mce_operator: "{{ (operators | selectattr('name', 'equalto', 'multicluster-engine') | list)[0] | default({}) }}"
    _mce_use_automatic: "{{ _mce_operator.connected_auto | default(false) | bool }}"
  ansible.builtin.set_fact:
    mce_subscription_spec:
      installPlanApproval: "{{ 'Automatic' if (_mce_use_automatic | bool) else 'Manual' }}"

- name: Set OADP subscription spec for disconnected
  when: disconnected | default(true) | bool
  ansible.builtin.set_fact:
    oadp_subscription_spec:
      installPlanApproval: Manual
      source: "{{ _core_operator_catalog_source }}"

- name: Set OADP subscription spec for connected
  when: not (disconnected | default(true) | bool)
  vars:
    _oadp_operator: "{{ (operators | selectattr('name', 'equalto', 'redhat-oadp-operator') | list)[0] | default({}) }}"
    _oadp_use_automatic: "{{ _oadp_operator.connected_auto | default(false) | bool }}"
  ansible.builtin.set_fact:
    oadp_subscription_spec:
      installPlanApproval: "{{ 'Automatic' if (_oadp_use_automatic | bool) else 'Manual' }}"

- name: Ensure RHACM MultiClusterHub is present with MCE and OADP subscription specs
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.open-cluster-management.io/v1
      kind: MultiClusterHub
      metadata:
        name: multiclusterhub
        namespace: open-cluster-management
        annotations:
          installer.open-cluster-management.io/mce-subscription-spec: "{{ mce_subscription_spec | to_json }}"
          installer.open-cluster-management.io/oadp-subscription-spec: "{{ oadp_subscription_spec | to_json }}"
      spec: {}
  retries: 60
  delay: 10
  register: r_mch
  until: r_mch is succeeded

- name: Wait until RHACM MultiClusterHub is ready
  kubernetes.core.k8s_info:
    api_version: operator.open-cluster-management.io/v1
    kind: MultiClusterHub
    name: multiclusterhub
    namespace: open-cluster-management
  register: r_mch_status
  retries: 120
  delay: 30
  until:
    - r_mch_status is defined
    - r_mch_status.resources is defined
    - r_mch_status.resources | length > 0
    - r_mch_status.resources[0].status is defined
    - r_mch_status.resources[0].status.phase is defined
    - r_mch_status.resources[0].status.phase == "Running"
