---
"$schema": "http://json-schema.org/draft-07/schema"
version: "1.0"
type: object

additionalProperties: false
properties:
  openshift_versions:
    "$ref": "#/definitions/openshiftVersionsList"
  overrideOpenshiftVersions:
    "$ref": "#/definitions/openshiftVersionsList"
    description: "Consumer override for openshift_versions from defaults/platforms.yaml (config/platforms.yaml only)"
oneOf:
- required: [openshift_versions]
- required: [overrideOpenshiftVersions]
