---
"$schema": "http://json-schema.org/draft-07/schema"
version: "1.0"
type: object

additionalProperties: false
properties:
  openshift_versions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          description: OpenShift version to be available
        default:
          type: boolean
          description: Default OpenShift version
        risks:
          type: array
          description: OpenShift version risks to be accepted
          items:
            type: object
            additionalProperties: false
            properties: 
              name:
                type: string
                description: OpenShift version risk name
              accept:
                type: boolean
                description: To accept or not to accept the risk
            required:
            - name
            - accept
      required:
      - version
required:
- openshift_versions
