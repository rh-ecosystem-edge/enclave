---
# Deploy a plugin to the OpenShift cluster
#
# This playbook loads the plugin configuration, applies defaults,
# and runs the plugin lifecycle: pre-validate -> mirror -> operators -> deploy -> post-validate.
#
# Usage:
#   ansible-playbook playbooks/deploy-plugin.yaml -e workingDir=/home/cloud-user -e plugin_name=example
#
# Required variables:
#   workingDir: Working directory on the Landing Zone
#   plugin_name: Name of the plugin directory under plugins/

- name: Deploy plugin - {{ plugin_name | default('UNSET') }}
  hosts: localhost
  gather_facts: false
  environment:
    PATH: "{{ workingDir | default('') }}/bin:{{ lookup('env', 'HOME') }}/.local/bin:{{ lookup('env', 'PATH') }}"
  tasks:
    - name: Validate workingDir is provided
      ansible.builtin.assert:
        that:
          - workingDir is defined
          - workingDir | length > 0
        fail_msg: "workingDir must be provided (e.g., -e workingDir=/home/cloud-user)"
      tags: always

    - name: Load common variables
      ansible.builtin.include_tasks:
        file: common/load-vars.yaml
      tags: always

    # The prepare phase does not run for day-2 deploys, so ensure the control
    # binaries (including the Helm CLI when this plugin uses it) are present. The
    # downloads are idempotent and checksum-validated, so this is a no-op when the
    # binaries are already in place. apply.tags propagates `always` to the included
    # tasks so the binaries are still downloaded under a tag-scoped run (e.g.
    # --tags mirror), which would otherwise skip the untagged child tasks.
    - name: Ensure control binaries are available
      ansible.builtin.include_tasks:
        file: tasks/download_control_binaries.yaml
        apply:
          tags: always
      tags: always

    - name: Deploy plugin
      ansible.builtin.include_tasks:
        file: tasks/deploy_plugin.yaml
      vars:
        plugin_mirror: true
      tags: always
