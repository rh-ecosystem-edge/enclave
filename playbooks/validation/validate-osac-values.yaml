---
# OSAC values overlay render (for schema validation).
#
# Renders plugins/osac/templates/values.yaml.j2 for a single profile so it can
# be validated against the pinned OSAC chart's values.schema.json via
# `helm template`. Variables are layered exactly as at deploy time:
#   - plugins/osac/defaults.yaml            static defaults (include_vars)
#   - a profile override file               permutation under test (-e@ ...)
#   - extractPlaceholders from plugin.yaml  deploy-time-only runtime stubs
#                                           (__r_ingress_config,
#                                           _osac_keycloak_hostname), applied
#                                           only if not already defined — the
#                                           same contract as the mirror
#                                           image-extraction path
#                                           (playbooks/tasks/helm_extract_single.yaml)
#
# Run once per profile (fresh scope) by
# ci/verification/validate_osac_values.sh.
#
# Required extra-vars:
#   osac_values_out : absolute path to write the rendered values file
# Optional:
#   -e@plugins/osac/test-fixtures/values/profile-*.yaml  profile overrides

- name: Render OSAC values overlay for schema validation
  hosts: localhost
  gather_facts: false
  vars:
    osac_plugin_dir: "{{ playbook_dir }}/../../plugins/osac"
  tasks:
    - name: Assert output path was provided
      ansible.builtin.assert:
        that:
          - osac_values_out is defined
          - osac_values_out | length > 0
        fail_msg: "osac_values_out must be provided (-e osac_values_out=/path/to/values.yaml)"

    - name: Load OSAC plugin defaults
      ansible.builtin.include_vars: "{{ osac_plugin_dir }}/defaults.yaml"

    - name: Load OSAC plugin descriptor
      ansible.builtin.set_fact:
        _osac_plugin: "{{ lookup('ansible.builtin.file', osac_plugin_dir ~ '/plugin.yaml') | from_yaml }}"

    - name: Collect deploy-time placeholder stubs from the OSAC helm entry
      ansible.builtin.set_fact:
        _osac_placeholders: "{{ (_osac_plugin.helm | first).extractPlaceholders | default({}) }}"

    - name: Apply placeholder stubs (only if not already defined)
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ _osac_placeholders | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.key not in vars

    - name: Render values overlay
      ansible.builtin.template:
        src: "{{ osac_plugin_dir }}/templates/values.yaml.j2"
        dest: "{{ osac_values_out }}"

    - name: Read rendered values overlay
      ansible.builtin.slurp:
        src: "{{ osac_values_out }}"
      register: _osac_values_raw

    - name: Assert rendered overlay is a valid YAML mapping
      ansible.builtin.assert:
        that:
          - _osac_values_raw.content | b64decode | from_yaml is mapping
        fail_msg: "Rendered OSAC values overlay is not a valid YAML mapping: {{ osac_values_out }}"
        success_msg: "Rendered OSAC values overlay parsed successfully ({{ osac_profile_name | default('unnamed') }})"

    - name: Parse rendered overlay
      ansible.builtin.set_fact:
        _osac_values: "{{ _osac_values_raw.content | b64decode | from_yaml }}"

    # The published chart owns the default AAP config-as-code source and the
    # revision stamped into that chart. Enclave must not silently replace it
    # with a moving branch such as main.
    - name: Assert default AAP project source follows the chart
      vars:
        _osac_config_as_code: "{{ _osac_values.aap.configAsCode | default({}) }}"
      when: osac_aap_project_git_uri is not defined and osac_aap_project_git_branch is not defined
      ansible.builtin.assert:
        that:
          - "'projectGitUri' not in _osac_config_as_code"
          - "'projectGitBranch' not in _osac_config_as_code"
        fail_msg: >-
          Default OSAC values must omit aap.configAsCode.projectGitUri and
          projectGitBranch so the chart-stamped AAP project revision is used.
        success_msg: "Default AAP project source follows the chart-stamped revision ({{ osac_profile_name | default('unnamed') }})"

    - name: Assert explicit AAP project source overrides are rendered
      vars:
        _osac_config_as_code: "{{ _osac_values.aap.configAsCode | default({}) }}"
      when: osac_aap_project_git_uri is defined or osac_aap_project_git_branch is defined
      ansible.builtin.assert:
        that:
          - osac_aap_project_git_uri is not defined or _osac_config_as_code.projectGitUri | default('') == osac_aap_project_git_uri
          - osac_aap_project_git_branch is not defined or _osac_config_as_code.projectGitBranch | default('') == osac_aap_project_git_branch
        fail_msg: >-
          Explicit osac_aap_project_git_uri and osac_aap_project_git_branch
          overrides must be passed through as aap.configAsCode.projectGitUri
          and projectGitBranch.
        success_msg: "Explicit AAP project source overrides rendered correctly ({{ osac_profile_name | default('unnamed') }})"

    - name: Expected internal Fulfillment listener for the operator
      ansible.builtin.set_fact:
        _osac_expected_fulfillment: "fulfillment-internal-api:8001"

    # Operator uses private gRPC methods the public listener rejects; catch a
    # regression at PR time rather than at runtime.
    - name: Assert operator targets the internal Fulfillment listener
      vars:
        _actual: "{{ _osac_values.operator.fulfillment.serverAddress | default('') }}"
      ansible.builtin.assert:
        that:
          - _actual | length > 0
          - _actual == _osac_expected_fulfillment
        fail_msg: >-
          operator.fulfillment.serverAddress must target the internal Fulfillment
          listener for private API traffic, not the public listener.
        success_msg: "operator.fulfillment.serverAddress targets the internal listener ({{ osac_profile_name | default('unnamed') }})"

    # BMF uses this issuer for Secret API token validation. Assert the value is
    # wired to the same external Keycloak realm as the rest of OSAC.
    - name: Assert BMF Secret API issuer URL
      vars:
        _actual: "{{ _osac_values.bmf.secretAPI.issuerUrl | default('') }}"
        _expected: "https://{{ _osac_keycloak_hostname }}/realms/{{ osac_keycloak_realm }}"
      ansible.builtin.assert:
        that:
          - _actual == _expected
        fail_msg: >-
          bmf.secretAPI.issuerUrl must use the external Keycloak realm issuer.
        success_msg: "BMF Secret API issuer URL is configured ({{ osac_profile_name | default('unnamed') }})"
