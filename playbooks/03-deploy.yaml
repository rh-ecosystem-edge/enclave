---
# Phase 3: Deploy - OpenShift cluster deployment
# This phase is common to both connected and disconnected deployments
#
# Performs:
# - Generate SSH keys
# - Extract openshift-install binary
# - Generate install-config.yaml and agent-config.yaml
# - Copy mirror manifests (disconnected only)
# - Generate Agent-Based Installer ISO
# - Copy ISO to web server
# - Skip hosts already Ready in the cluster (idempotent reruns)
# - Boot agent hosts with their boot plugins (setup and boot hooks)
# - Wait for deployment to complete
# - Run the boot plugins' post-install and cleanup hooks
#
# Usage:
#   ansible-playbook playbooks/03-deploy.yaml [-e disconnected=false]

- name: Phase 3 - Deploy OpenShift cluster
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load common variables
      ansible.builtin.include_tasks:
        file: common/load-vars.yaml
        apply:
          tags: always
      tags: always

    - name: Execute tasks with workingDir in PATH
      environment:
        PATH: "{{ workingDir }}/bin:{{ lookup('env', 'HOME') }}/.local/bin:{{ lookup('env', 'PATH') }}"
      block:
        - name: Display deployment mode
          ansible.builtin.debug:
            msg: "Deploying in {{ 'disconnected' if (disconnected | default(true)) else 'connected' }} mode"
          tags: always

        - name: Include tasks for OCP ABI
          ansible.builtin.include_tasks:
            file: tasks/configure_ocp_abi.yaml
            apply:
              tags: configure-abi
          tags: configure-abi

        - name: Filter agent hosts already provisioned in the cluster
          ansible.builtin.include_tasks:
            file: tasks/configure_hardware_filter_hosts.yaml
            apply:
              tags: hardware
          tags: hardware

        - name: Boot hosts via boot plugins
          ansible.builtin.include_tasks:
            file: tasks/boot/boot_hosts.yaml
            apply:
              tags: hardware
          tags: hardware
          when: agent_hosts_to_provision | length > 0

        - name: Pre-install validate plugins
          ansible.builtin.include_tasks:
            file: tasks/pre_install_validate_plugins.yaml
            apply:
              tags: pre-install-validate
          tags: pre-install-validate

        - name: Set up enclave kubeconfig symlink
          ansible.builtin.include_tasks:
            file: tasks/setup_enclave_kubeconfig_symlink.yaml

        - name: Wait for deployment
          ansible.builtin.include_tasks:
            file: tasks/wait_for_deployment.yaml
            apply:
              tags: wait-deployment
          tags: wait-deployment
