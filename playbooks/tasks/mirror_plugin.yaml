---
- name: Validate mirror plugin conditions
  ansible.builtin.assert:
    that:
      - plugin is defined
      - plugin_mirror | default(false) | bool
      - plugin.operators | default([]) | length > 0 or plugin.additionalImages | default([]) | length > 0
      - disconnected | default(true) | bool
    fail_msg: >-
      Validation Error: Ensure 'plugin' is defined, 'plugin_mirror' is set to true,
      'plugin.operators' or 'plugin.additionalImages' are not empty, and 'disconnected' is true.

- name: Template plugin imageset configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/plugin-imageset.yaml.j2"
    dest: "{{ workingDir }}/plugin-{{ plugin_name }}-imageset.yaml"

- name: Ensure oc-mirror log directory exists
  ansible.builtin.file:
    path: "{{ workingDir }}/logs/"
    state: directory

- name: Set oc-mirror plugin log path
  ansible.builtin.set_fact:
    _oc_mirror_plugin_log: "{{ workingDir }}/logs/oc-mirror-plugin-{{ plugin_name }}.progress.{{ lookup('pipe', 'date +%s') }}.log"

- name: Show oc-mirror log path
  ansible.builtin.debug:
    msg: "oc-mirror log file: {{ _oc_mirror_plugin_log }}"

- name: Run oc-mirror for plugin
  block:
    - name: Run oc-mirror for plugin {{ plugin_name }}
      ansible.builtin.shell: |
        echo "===== oc-mirror attempt started at $(date -Is) =====" >> {{ _oc_mirror_plugin_log }}
        {{ workingDir }}/bin/oc-mirror --v2 \
          --log-level {{ ocMirrorLogLevel }} \
          --authfile "{{ pullSecretPath }}" \
          --remove-signatures=false \
          -c {{ workingDir }}/plugin-{{ plugin_name }}-imageset.yaml \
          --workspace file://{{ workingDir }}/config/oc-mirror-workspace \
          docker://{{ quayHostname }}:8443 \
          --dest-tls-verify=false \
          --parallel-images {{ ocMirrorParallelImages }} \
          --parallel-layers {{ ocMirrorParallelLayers }} \
          --retry-times {{ ocMirrorRetryTimes }} \
          --retry-delay {{ ocMirrorRetryDelay }} \
          >> {{ _oc_mirror_plugin_log }} 2>&1
      retries: "{{ ocMirrorAnsibleRetries }}"
      delay: "{{ ocMirrorAnsibleDelay }}"
      register: r_plugin_mirror
      until: r_plugin_mirror is success

  rescue:
    - name: Read oc-mirror log tail
      ansible.builtin.command:
        argv:
          - tail
          - -n
          - "10"
          - "{{ _oc_mirror_plugin_log }}"
      register: _oc_mirror_plugin_tail
      changed_when: false
      failed_when: false

    - name: oc-mirror failed
      ansible.builtin.fail:
        msg: |-
          oc-mirror for plugin {{ plugin_name }} failed after {{ r_plugin_mirror.attempts }} attempts.

          {{ _oc_mirror_plugin_tail.stdout | default('Unable to read oc-mirror log tail.') }}

          Full log: {{ _oc_mirror_plugin_log }}

- name: Prepare LZ mirror manifests
  block:
    - name: Set landing-zone cluster resources directory
      ansible.builtin.set_fact:
        lz_cluster_resources_dir: "{{ workingDir }}/config/oc-mirror-workspace/working-dir/cluster-resources"

    - name: Stat landing-zone IDMS source
      ansible.builtin.stat:
        path: "{{ lz_cluster_resources_dir }}/idms-oc-mirror.yaml"
      register: lz_idms_src_stat

    - name: Stat landing-zone ITMS source
      ansible.builtin.stat:
        path: "{{ lz_cluster_resources_dir }}/itms-oc-mirror.yaml"
      register: lz_itms_src_stat

    # Dedicated IDMS/ITMS per plugin; oc-mirror overwrites generic idms-oc-mirror.yaml — remove after copy.
    # oc-mirror v2 may emit multiple resources per file; names must stay unique (idms-<slice>-plugin-<name>).
    # Quay apply uses idms-<slice>-plugin-<name>-internal (quay_disconnected_mirrors.yaml).
    - name: Copy LZ IDMS to plugin-specific manifest
      ansible.builtin.copy:
        src: "{{ lz_cluster_resources_dir }}/idms-oc-mirror.yaml"
        dest: "{{ lz_cluster_resources_dir }}/idms-oc-mirror-plugin-{{ plugin_name }}.yaml"
        remote_src: true
      when: lz_idms_src_stat.stat.exists

    - name: Rename ImageDigestMirrorSet names in plugin LZ IDMS manifest
      ansible.builtin.replace:
        path: "{{ lz_cluster_resources_dir }}/idms-oc-mirror-plugin-{{ plugin_name }}.yaml"
        regexp: '^(\s*name:\s*)idms-([^\s]+)\s*$'
        replace: '\1idms-\2-plugin-{{ plugin_name }}'
      when: lz_idms_src_stat.stat.exists

    - name: Remove generic LZ IDMS after plugin-specific copy
      ansible.builtin.file:
        path: "{{ lz_cluster_resources_dir }}/idms-oc-mirror.yaml"
        state: absent
      when: lz_idms_src_stat.stat.exists

    - name: Copy LZ ITMS to plugin-specific manifest
      ansible.builtin.copy:
        src: "{{ lz_cluster_resources_dir }}/itms-oc-mirror.yaml"
        dest: "{{ lz_cluster_resources_dir }}/itms-oc-mirror-plugin-{{ plugin_name }}.yaml"
        remote_src: true
      when: lz_itms_src_stat.stat.exists

    - name: Rename ImageTagMirrorSet names in plugin LZ ITMS manifest
      ansible.builtin.replace:
        path: "{{ lz_cluster_resources_dir }}/itms-oc-mirror-plugin-{{ plugin_name }}.yaml"
        regexp: '^(\s*name:\s*)itms-([^\s]+)\s*$'
        replace: '\1itms-\2-plugin-{{ plugin_name }}'
      when: lz_itms_src_stat.stat.exists

    - name: Remove generic LZ ITMS after plugin-specific copy
      ansible.builtin.file:
        path: "{{ lz_cluster_resources_dir }}/itms-oc-mirror.yaml"
        state: absent
      when: lz_itms_src_stat.stat.exists
  when:
    - r_plugin_mirror is defined
    - r_plugin_mirror is success

# A plugin that declares operators but doesn't install them on the hub
# (installOperators: false) and has no Helm charts (which run on the hub) only
# targets managed clusters, which get its mirrors through ACM
# (configure_plugin_fleet_mirrors.yaml). Its mirror sets would only roll out the hub,
# so skip them.
- name: Decide whether the hub needs the plugin mirror sets
  ansible.builtin.set_fact:
    _plugin_hub_mirror_sets: >-
      {{ not (plugin.operators | default([]) | length > 0
              and not (plugin.installOperators | default(true) | bool)
              and plugin.helm | default([]) | length == 0) }}

- name: Skip the hub mirror sets for a managed-cluster-only plugin
  ansible.builtin.debug:
    msg: "Mirror sets not applied to the hub: {{ plugin_name }} targets managed clusters only."
  when: not (_plugin_hub_mirror_sets | bool)

# The LZ cluster-resources directory is applied as a whole by later plugins; move this
# plugin's IDMS/ITMS out of it before the Quay pass (which can fail and stop the play),
# so they never reach the hub, even after a failed run.
- name: Move the skipped plugin mirror sets out of the shared cluster-resources directory
  ansible.builtin.shell: |
    set -euo pipefail
    dest="{{ lz_cluster_resources_dir }}-managed-only"
    mkdir -p "$dest"
    for f in "{{ lz_cluster_resources_dir }}"/idms-oc-mirror-plugin-{{ plugin_name }}.yaml \
             "{{ lz_cluster_resources_dir }}"/itms-oc-mirror-plugin-{{ plugin_name }}.yaml; do
      if [ -f "$f" ]; then mv -f "$f" "$dest/"; echo "moved $f"; fi
    done
  args:
    executable: /bin/bash
  register: r_move_skipped_mirror_sets
  changed_when: "'moved' in r_move_skipped_mirror_sets.stdout"
  when:
    - not (_plugin_hub_mirror_sets | bool)
    - lz_cluster_resources_dir is defined

# --- Mirror addon plugin images to Quay Enterprise ---
# Addon plugins (mirror: plugin) are mirrored to the LZ registry above, but
# spoke clusters pull from Quay Enterprise. Re-mirror from LZ to Quay Enterprise
# following the same pattern as quay_disconnected.yaml.

- name: Copy plugin imageset to internal version for Quay Enterprise mirror
  ansible.builtin.copy:
    src: "{{ workingDir }}/plugin-{{ plugin_name }}-imageset.yaml"
    dest: "{{ workingDir }}/plugin-{{ plugin_name }}-imageset.internal.yaml"
    remote_src: true
  when:
    - r_plugin_mirror is defined
    - r_plugin_mirror is success

- name: Replace upstream catalog with LZ registry in internal plugin imageset
  ansible.builtin.replace:
    path: "{{ workingDir }}/plugin-{{ plugin_name }}-imageset.internal.yaml"
    regexp: 'catalog: {{ catalog_image }}'
    replace: 'catalog: {{ quayHostname }}:8443/redhat/{{ catalog_mirror }}'
  when:
    - r_plugin_mirror is defined
    - r_plugin_mirror is success

- name: Ensure .config/containers/ exists for plugin registries.conf
  ansible.builtin.file:
    path: "{{ lookup('env','HOME') }}/.config/containers/"
    state: directory
  when:
    - r_plugin_mirror is defined
    - r_plugin_mirror is success

- name: Generate registries.conf for plugin Quay Enterprise mirror
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/registries.conf.j2"
    dest: "{{ lookup('env','HOME') }}/.config/containers/registries.conf"
  vars:
    _core_plugin_registries: "{{ plugin.registries | default([]) }}"
  when:
    - r_plugin_mirror is defined
    - r_plugin_mirror is success

- name: Set oc-mirror plugin Quay Enterprise log path
  ansible.builtin.set_fact:
    _oc_mirror_plugin_quay_log: "{{ workingDir }}/logs/oc-mirror-plugin-{{ plugin_name }}-quay.progress.{{ lookup('pipe', 'date +%s') }}.log"
  when:
    - r_plugin_mirror is defined
    - r_plugin_mirror is success

- name: Show oc-mirror plugin Quay Enterprise log path
  ansible.builtin.debug:
    msg: "oc-mirror log file: {{ _oc_mirror_plugin_quay_log }}"
  when:
    - r_plugin_mirror is defined
    - r_plugin_mirror is success

- name: Run oc-mirror for plugin (Quay Enterprise)
  when:
    - r_plugin_mirror is defined
    - r_plugin_mirror is success
  block:
    - name: Run oc-mirror for plugin {{ plugin_name }} (Quay Enterprise)
      ansible.builtin.shell: |
        echo "===== oc-mirror attempt started at $(date -Is) =====" >> {{ _oc_mirror_plugin_quay_log }}
        {{ workingDir }}/bin/oc-mirror --v2 \
          --log-level {{ ocMirrorLogLevel }} \
          --authfile {{ workingDir }}/config/pull-secret.quay.json \
          --remove-signatures=false \
          -c {{ workingDir }}/plugin-{{ plugin_name }}-imageset.internal.yaml \
          --workspace file://{{ workingDir }}/config/oc-mirror-workspace-quay \
          docker://registry-quay-quay-enterprise.apps.{{ clusterName }}.{{ baseDomain }} \
          --dest-tls-verify=false \
          --src-tls-verify=false \
          --parallel-images {{ ocMirrorParallelImages }} \
          --parallel-layers {{ ocMirrorParallelLayersLocalStorage if quayBackend == 'LocalStorage' else ocMirrorParallelLayers }} \
          --retry-times {{ ocMirrorRetryTimes }} \
          --retry-delay {{ ocMirrorRetryDelay }} \
          --image-timeout {{ ocMirrorImageTimeout }} \
          >> {{ _oc_mirror_plugin_quay_log }} 2>&1
      retries: "{{ ocMirrorAnsibleRetries }}"
      delay: "{{ ocMirrorAnsibleDelay }}"
      register: r_plugin_mirror_quay
      until: r_plugin_mirror_quay is success

  rescue:
    - name: Read oc-mirror log tail
      ansible.builtin.command:
        argv:
          - tail
          - -n
          - "10"
          - "{{ _oc_mirror_plugin_quay_log }}"
      register: _oc_mirror_plugin_quay_tail
      changed_when: false
      failed_when: false

    - name: oc-mirror failed
      ansible.builtin.fail:
        msg: |-
          oc-mirror for plugin {{ plugin_name }} (Quay Enterprise) failed after {{ r_plugin_mirror_quay.attempts }} attempts.

          {{ _oc_mirror_plugin_quay_tail.stdout | default('Unable to read oc-mirror log tail.') }}

          Full log: {{ _oc_mirror_plugin_quay_log }}

- name: Delete registries.conf after plugin Quay Enterprise mirror
  ansible.builtin.file:
    path: "{{ lookup('env','HOME') }}/.config/containers/registries.conf"
    state: absent
  when:
    - r_plugin_mirror is defined
    - r_plugin_mirror is success

- name: Prepare Quay Enterprise mirrors for plugin
  ansible.builtin.include_tasks:
    file: "../../operators/quay-operator/quay_disconnected_mirrors.yaml"
    apply:
      environment:
        KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  vars:
    quay_mirror_skip_apply: true
  when:
    - r_plugin_mirror_quay is defined
    - r_plugin_mirror_quay is success

# --- Apply all mirror manifests at once to trigger a single MCO rollout ---
# Both oc-mirror runs (LZ and Quay Enterprise) complete without needing IDMS/ITMS
# on the cluster. Applying all manifests here triggers one MCO rollout instead of two.

- name: Show mirror manifests to apply
  ansible.builtin.debug:
    msg:
      lz_cluster_resources_dir: "{{ lz_cluster_resources_dir | default('n/a') }}"
      quay_idms_manifest: "{{ quay_idms_apply_manifest | default('n/a') }}"
      quay_itms_manifest: "{{ quay_itms_apply_manifest | default('n/a') }}"
  when:
    - _plugin_hub_mirror_sets | bool
    - (r_plugin_mirror is defined and r_plugin_mirror is success) or
      (r_plugin_mirror_quay is defined and r_plugin_mirror_quay is success)

# An interrupted earlier run can leave a rollout unfinished (e.g. after a CA change,
# which then reports no change on the re-run): a non-paused pool still Updating or not
# yet Updated. Unreadable pools count as pending so the wait reports them.
- name: Check for an unfinished MachineConfigPool rollout
  ansible.builtin.command:
    argv: ["{{ workingDir }}/bin/oc", get, mcp, -o, json, --request-timeout=30s]
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_plugin_mcp_pending
  changed_when: false
  failed_when: false
  timeout: 120

# A CA change marks a pending UpdateService restart before it is made and the marker is
# cleared only after the restart (restart_updateservice_for_ca.yaml), so it also catches
# a re-run that starts before the MCO reports that change's rollout. Unreadable counts
# as pending.
- name: Check for a pending UpdateService CA restart
  ansible.builtin.command:
    argv: ["{{ workingDir }}/bin/oc", get, configmap, enclave-updateservice-ca-restart-pending,
           -n, openshift-config, --ignore-not-found, -o, name, --request-timeout=30s]
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_plugin_ca_restart_pending
  changed_when: false
  failed_when: false
  timeout: 120

# The hub rolls out for the mirror sets applied below, for a hub Quay CA change (made
# by the Quay mirror step above, or left pending by an interrupted run) or to finish an
# interrupted rollout, even for a managed-cluster-only plugin.
- name: Decide whether the hub rolls out
  vars:
    _pools: "{{ (r_plugin_mcp_pending.stdout | from_json)['items'] if r_plugin_mcp_pending.rc | default(1) == 0 else [] }}"
    _conditions: >-
      {{
        ((_pools | rejectattr('spec.paused', 'defined') | list)
          + (_pools | selectattr('spec.paused', 'defined') | rejectattr('spec.paused') | list))
        | selectattr('status.conditions', 'defined')
        | map(attribute='status.conditions')
        | flatten
      }}
    _mcp_pending: >-
      {{
        (r_plugin_mcp_pending.rc | default(1) != 0)
        or (_conditions | selectattr('type', 'equalto', 'Updating')
              | selectattr('status', 'equalto', 'True') | list | length > 0)
        or (_conditions | selectattr('type', 'equalto', 'Updated')
              | rejectattr('status', 'equalto', 'True') | list | length > 0)
      }}
  ansible.builtin.set_fact:
    _plugin_hub_rollout: >-
      {{ (_plugin_hub_mirror_sets | bool
          and ((r_plugin_mirror is defined and r_plugin_mirror is success)
               or (r_plugin_mirror_quay is defined and r_plugin_mirror_quay is success)))
         or (r_quay_ca_configmap | default({}) is changed)
         or (r_quay_ca_existing_configmap | default({}) is changed)
         or (r_quay_ca_image_config | default({}) is changed)
         or (_mcp_pending | bool)
         or (r_plugin_ca_restart_pending.rc | default(1) != 0)
         or (r_plugin_ca_restart_pending.stdout | default('') | trim | length > 0) }}

# On LVMS, keep the UpdateService's PodDisruptionBudget from deadlocking the rollout's
# drains (see updateservice_mirror_rollout_guard.yaml); restored after the wait.
- name: Lower the UpdateService for the mirror rollout
  ansible.builtin.include_tasks: updateservice_mirror_rollout_guard.yaml
  vars:
    updateservice_guard: lower
  when:
    - storage_plugin | default('') == 'lvms'
    - _plugin_hub_rollout | bool

- name: Apply LZ mirror manifests to cluster
  ansible.builtin.shell: |
    {{ workingDir }}/bin/oc apply \
      -f {{ lz_cluster_resources_dir }}/ \
      --server-side --force-conflicts
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  when:
    - _plugin_hub_mirror_sets | bool
    - r_plugin_mirror is defined
    - r_plugin_mirror is success

- name: Apply Quay IDMS to cluster
  ansible.builtin.command:
    argv:
      - "{{ workingDir }}/bin/oc"
      - apply
      - -f
      - "{{ quay_idms_apply_manifest }}"
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  when:
    - _plugin_hub_mirror_sets | bool
    - r_plugin_mirror_quay is defined
    - r_plugin_mirror_quay is success
    - quay_idms_apply_manifest is defined

- name: Apply Quay ITMS to cluster
  ansible.builtin.command:
    argv:
      - "{{ workingDir }}/bin/oc"
      - apply
      - -f
      - "{{ quay_itms_apply_manifest }}"
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  when:
    - _plugin_hub_mirror_sets | bool
    - r_plugin_mirror_quay is defined
    - r_plugin_mirror_quay is success
    - quay_itms_apply_manifest is defined

- name: Wait for MachineConfigPool to finish updating
  ansible.builtin.include_tasks: wait_mcp.yaml
  when: _plugin_hub_rollout | bool

# The rollout restarts the Quay app pods on every storage backend (Pending on LVMS
# node-local volumes, crash-looping on ODF); wait for a ready replica before anything
# pulls from the registry again. On LVMS this also prepares the UpdateService restore.
- name: Wait for the hub Quay app after the mirror rollout
  ansible.builtin.include_tasks: wait_hub_quay_after_rollout.yaml

- name: Restore the UpdateService after the mirror rollout
  ansible.builtin.include_tasks: updateservice_mirror_rollout_guard.yaml
  vars:
    updateservice_guard: restore
  when: storage_plugin | default('') == 'lvms'

# The Quay mirror step above deferred the UpdateService restart (only done if a CA change is
# pending) until the rollout has settled.
- name: Restart UpdateService deployment to reload registry CA trust
  ansible.builtin.include_tasks: restart_updateservice_for_ca.yaml
  when:
    - r_plugin_mirror_quay is defined
    - r_plugin_mirror_quay is success

- name: Wait for updated CatalogSource to be ready
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: CatalogSource
    namespace: openshift-marketplace
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_catalog_sources
  retries: 24
  delay: 10
  until: >-
    r_catalog_sources.resources | default([])
    | selectattr('status', 'defined')
    | selectattr('status.connectionState', 'defined')
    | selectattr('status.connectionState.lastObservedState', 'equalto', 'READY')
    | list | length >= (r_catalog_sources.resources | length)
  when:
    - plugin.installOperators | default(true)
    - r_plugin_mirror is defined
    - r_plugin_mirror is success

- name: Create stable aliases for mirrored plugin CatalogSources
  ansible.builtin.include_tasks:
    file: create_stable_catalog_source_aliases.yaml
  when:
    - _plugin_hub_mirror_sets | bool
    - r_plugin_mirror is defined
    - r_plugin_mirror is success
