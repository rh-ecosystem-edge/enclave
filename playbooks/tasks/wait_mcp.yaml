---
# Wait for a MachineConfigPool rollout: up to 3 minutes for one to show up, then up
# to 30 minutes for all pools to finish. A pool is busy while it is Updating or not
# yet Updated (a new config rendered but not started). Paused pools are ignored; a
# pool without spec.paused counts as not paused. Logs each pool's state and rendered
# config when a rollout is detected and when it completes. Each poll is bounded by
# --request-timeout and each wait by a task timeout, so an unreachable API fails the
# wait instead of hanging it.
- name: Wait for MachineConfigPool to detect pending changes (if any)
  ansible.builtin.command:
    argv: ["{{ workingDir }}/bin/oc", get, mcp, -o, json, --request-timeout=30s]
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_mcp_detect
  vars:
    _pools: "{{ (r_mcp_detect.stdout | from_json)['items'] if r_mcp_detect.rc | default(1) == 0 else [] }}"
    _conditions: >-
      {{
        ((_pools | rejectattr('spec.paused', 'defined') | list)
          + (_pools | selectattr('spec.paused', 'defined') | rejectattr('spec.paused') | list))
        | selectattr('status.conditions', 'defined')
        | map(attribute='status.conditions')
        | flatten
      }}
  changed_when: false
  failed_when: false
  retries: 6
  delay: 30
  timeout: 300
  until: >-
    (_conditions | selectattr('type', 'equalto', 'Updating')
      | selectattr('status', 'equalto', 'True') | list | length > 0)
    or
    (_conditions | selectattr('type', 'equalto', 'Updated')
      | rejectattr('status', 'equalto', 'True') | list | length > 0)

- name: Set MCP updating detected fact
  vars:
    _pools: "{{ (r_mcp_detect.stdout | from_json)['items'] if r_mcp_detect.rc | default(1) == 0 else [] }}"
    _conditions: >-
      {{
        ((_pools | rejectattr('spec.paused', 'defined') | list)
          + (_pools | selectattr('spec.paused', 'defined') | rejectattr('spec.paused') | list))
        | selectattr('status.conditions', 'defined')
        | map(attribute='status.conditions')
        | flatten
      }}
  ansible.builtin.set_fact:
    _mcp_updating_detected: >-
      {{
        (_conditions | selectattr('type', 'equalto', 'Updating')
          | selectattr('status', 'equalto', 'True') | list | length > 0)
        or
        (_conditions | selectattr('type', 'equalto', 'Updated')
          | rejectattr('status', 'equalto', 'True') | list | length > 0)
      }}

- name: Show the MachineConfigPools in the detected rollout
  vars:
    _pools: "{{ (r_mcp_detect.stdout | from_json)['items'] if r_mcp_detect.rc | default(1) == 0 else [] }}"
    _active: >-
      {{
        (_pools | rejectattr('spec.paused', 'defined') | list)
        + (_pools | selectattr('spec.paused', 'defined') | rejectattr('spec.paused') | list)
      }}
    _conds: "{{ item.status.conditions | default([]) }}"
  ansible.builtin.debug:
    msg: >-
      Rollout detected: {{ item.metadata.name }}:
      Updated={{ _conds | selectattr('type', 'equalto', 'Updated') | map(attribute='status') | first | default('?') }}
      Updating={{ _conds | selectattr('type', 'equalto', 'Updating') | map(attribute='status') | first | default('?') }}
      config {{ item.status.configuration.name | default('?') }} -> {{ item.spec.configuration.name | default('?') }}
  loop: "{{ _active }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: _mcp_updating_detected | bool

- name: Wait for MachineConfigPool to finish updating
  ansible.builtin.command:
    argv: ["{{ workingDir }}/bin/oc", get, mcp, -o, json, --request-timeout=30s]
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_mcp
  vars:
    _pools: "{{ (r_mcp.stdout | from_json)['items'] if r_mcp.rc | default(1) == 0 else [] }}"
    _conditions: >-
      {{
        ((_pools | rejectattr('spec.paused', 'defined') | list)
          + (_pools | selectattr('spec.paused', 'defined') | rejectattr('spec.paused') | list))
        | selectattr('status.conditions', 'defined')
        | map(attribute='status.conditions')
        | flatten
      }}
  changed_when: false
  retries: 60
  delay: 30
  timeout: 2400
  when: _mcp_updating_detected | bool
  until: >-
    (r_mcp.rc | default(1) == 0)
    and
    (_conditions | selectattr('type', 'equalto', 'Updating')
      | selectattr('status', 'equalto', 'True') | list | length == 0)
    and
    (_conditions | selectattr('type', 'equalto', 'Updated')
      | rejectattr('status', 'equalto', 'True') | list | length == 0)
    and
    (_conditions | selectattr('type', 'equalto', 'Degraded')
      | selectattr('status', 'equalto', 'True') | list | length == 0)

- name: MCP rollout complete
  vars:
    _pools: "{{ (r_mcp.stdout | from_json)['items'] if r_mcp.rc | default(1) == 0 else [] }}"
    _active: >-
      {{
        (_pools | rejectattr('spec.paused', 'defined') | list)
        + (_pools | selectattr('spec.paused', 'defined') | rejectattr('spec.paused') | list)
      }}
    _conds: "{{ item.status.conditions | default([]) }}"
  ansible.builtin.debug:
    msg: >-
      Rollout complete: {{ item.metadata.name }}:
      Updated={{ _conds | selectattr('type', 'equalto', 'Updated') | map(attribute='status') | first | default('?') }}
      Updating={{ _conds | selectattr('type', 'equalto', 'Updating') | map(attribute='status') | first | default('?') }}
      config {{ item.status.configuration.name | default('?') }} -> {{ item.spec.configuration.name | default('?') }}
  loop: "{{ _active }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: _mcp_updating_detected | bool
