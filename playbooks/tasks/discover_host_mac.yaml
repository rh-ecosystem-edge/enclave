- name: Probe the configured host to populate the Landing Zone neighbor table
  ansible.builtin.command:
    argv:
      - ping
      - -c
      - "1"
      - -W
      - "2"
      - "{{ host_to_resolve.ipAddress }}"
  changed_when: false
  failed_when: false
  register: r_host_probe
  no_log: true

- name: Read the configured host neighbor entry
  ansible.builtin.command:
    argv:
      - ip
      - -o
      - neigh
      - show
      - to
      - "{{ host_to_resolve.ipAddress }}"
  register: r_host_neighbors
  changed_when: false
  no_log: true

- name: Find distinct fresh MAC addresses for the configured host
  ansible.builtin.set_fact:
    discovered_host_macs: >-
      {{ (r_host_neighbors.stdout
         | regex_findall('^.*\\sREACHABLE(?:\\s|$)', multiline=True)
         | join(' '))
         | regex_findall('lladdr +([0-9a-fA-F:]{17})')
         | map('lower') | unique | list
         if r_host_probe.rc == 0 else [] }}
  no_log: true

- name: Require one fresh MAC address for the configured host
  ansible.builtin.assert:
    that:
      - discovered_host_macs | length == 1
    fail_msg: >-
      Could not discover exactly one fresh MAC address for a configured host.
      Ensure the host is reachable from the Landing Zone on the same network, or
      set macAddress explicitly in its configuration.

- name: Set the discovered MAC address for the configured host
  ansible.builtin.set_fact:
    resolved_mac_address: "{{ discovered_host_macs[0] }}"
  no_log: true
