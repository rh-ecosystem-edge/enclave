---
# Trust the Quay registry route TLS cert for image pulls and UpdateService.
# Routes signed by the ingress router CA use router-ca; externally signed routes
# (for example ZeroSSL) use the intermediate/root CAs fetched from the live chain.
# OSUS graph-builder reads updateservice-registry from the image.config additionalTrustedCA
# ConfigMap; nodes use the registry hostname key. When the CA changes, marks an
# UpdateService restart as pending and restarts it, unless the caller defers the restart
# (quay_ca_defer_updateservice_restart).

- name: Set Quay registry hostname for image trust
  ansible.builtin.set_fact:
    quay_registry_hostname: "registry-quay-quay-enterprise.apps.{{ clusterName }}.{{ baseDomain }}"

- name: Build Quay registry CA resolve command arguments
  ansible.builtin.set_fact:
    _resolve_quay_ca_argv: >-
      {{ ['enclave', 'tools', 'resolve-quay-registry-ca',
          '--hostname', quay_registry_hostname,
          '--oc', workingDir + '/bin/oc']
         + (['--ca-pem', sslCACertificate] if sslCACertificate is defined and sslCACertificate | length > 0 else []) }}

- name: Resolve Quay registry CA PEM for trust ConfigMap
  ansible.builtin.command:
    argv: "{{ _resolve_quay_ca_argv }}"
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: quay_registry_ca_resolved
  changed_when: false

# UpdateService operator requires updateservice-registry; nodes use the registry hostname key.
- name: Set Quay registry CA ConfigMap data keys
  ansible.builtin.set_fact:
    quay_registry_ca_configmap_data: >-
      {{ {
        quay_registry_hostname: quay_registry_ca_resolved.stdout,
        'updateservice-registry': quay_registry_ca_resolved.stdout
      } }}

- name: Get current image config additionalTrustedCA ConfigMap name
  ansible.builtin.shell: |
    {{ workingDir }}/bin/oc get image.config.openshift.io/cluster -o jsonpath='{.spec.additionalTrustedCA.name}'
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: image_config_trusted_ca_name
  changed_when: false
  failed_when: false

# Detect a CA change first (check mode) and mark the UpdateService restart as pending
# before writing, so a failure at any later point, the marker included, leaves the
# restart pending for the next run. The marker is kept until
# restart_updateservice_for_ca.yaml has restarted the UpdateService.
- name: Detect a Quay registry CA change
  ansible.builtin.include_tasks:
    file: write_quay_registry_ca.yaml
    apply:
      check_mode: true

- name: Mark an UpdateService CA restart as pending
  when: >-
    (r_quay_ca_configmap | default({}) is changed)
    or (r_quay_ca_existing_configmap | default({}) is changed)
    or (r_quay_ca_image_config | default({}) is changed)
  ansible.builtin.command:
    argv: ["{{ workingDir }}/bin/oc", create, configmap, enclave-updateservice-ca-restart-pending,
           -n, openshift-config, --request-timeout=30s]
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_updateservice_restart_mark
  changed_when: r_updateservice_restart_mark.rc == 0
  failed_when:
    - r_updateservice_restart_mark.rc != 0
    - '"already exists" not in r_updateservice_restart_mark.stderr | lower'

- name: Write the Quay registry CA trust
  ansible.builtin.include_tasks: write_quay_registry_ca.yaml

# Callers that trigger a MachineConfig rollout set quay_ca_defer_updateservice_restart and
# include restart_updateservice_for_ca.yaml after the rollout has settled.
- name: Restart UpdateService deployment to reload registry CA trust
  ansible.builtin.include_tasks: restart_updateservice_for_ca.yaml
  when: not (quay_ca_defer_updateservice_restart | default(false) | bool)
