- name: Start with the configured MAC address
  ansible.builtin.set_fact:
    resolved_mac_address: "{{ host_to_resolve.macAddress | default('') }}"
  no_log: true

- name: Require an IP address to discover a missing MAC address
  ansible.builtin.assert:
    that:
      - host_to_resolve.ipAddress is defined
    fail_msg: >-
      A host without macAddress must provide ipAddress for simple IP-based
      configuration. Advanced network configurations must set macAddress explicitly.
  when: resolved_mac_address | length == 0

- name: Discover the MAC address when omitted
  ansible.builtin.include_tasks:
    file: discover_host_mac.yaml
    apply:
      tags: hardware
  tags: hardware
  when: resolved_mac_address | length == 0

- name: Add the configured host to the resolved host list
  ansible.builtin.set_fact:
    resolved_host_macs: >-
      {{ resolved_host_macs +
         [host_to_resolve | combine({'macAddress': resolved_mac_address})] }}
  no_log: true
