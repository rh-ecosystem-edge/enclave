---
# Reusable tasks for deploying a plugin
#
# Required variables:
#   plugin_name: Name of the plugin directory under plugins/
#   workingDir: Working directory on the Landing Zone
#
# This file is included from both deploy-plugin.yaml (standalone) and
# 05-operators.yaml (core pipeline integration). Plugin context loading and the
# mirror steps are shared with mirror-plugin.yaml via load_plugin_context.yaml
# and mirror_plugin_steps.yaml.

- name: "{{ plugin_name | default('plugin') }} | Load plugin context"
  ansible.builtin.include_tasks:
    file: tasks/load_plugin_context.yaml
    apply:
      tags: always
  tags: always

- name: "{{ plugin_name }} | Validate managed-only mirror configuration"
  ansible.builtin.assert:
    that:
      - not (
          plugin.operators | default([]) | length > 0
          and not (plugin.installOperators | default(true) | bool)
          and plugin.helm | default([]) | length == 0
          and plugin.registries | default([]) | length == 0
        )
    fail_msg: >-
      Plugin '{{ plugin.name }}' is managed-cluster-only but declares no registries.
      Add at least one entry under registries, or enable operator installation/use a
      Helm chart so the plugin has a valid mirror-delivery path.
  when:
    - disconnected | default(true) | bool
  tags: always

- name: "{{ plugin_name }} | Run pre-validate"
  ansible.builtin.include_tasks:
    file: "{{ plugin_dir }}/tasks/pre-validate.yaml"
    apply:
      tags: pre-validate
      environment:
        KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  when: lookup('ansible.builtin.fileglob', plugin_dir ~ '/tasks/pre-validate.yaml') | length > 0
  tags: pre-validate

- name: "{{ plugin_name }} | Mirror plugin steps"
  ansible.builtin.include_tasks:
    file: tasks/mirror_plugin_steps.yaml
    apply:
      tags: mirror
  tags: mirror

# Managed-cluster-only plugins (operators listed, installOperators: false, no Helm
# charts; see mirror_plugin.yaml) get their mirrors on the clusters they target
# through ACM.
- name: "{{ plugin_name }} | Deliver plugin mirrors to its managed clusters"
  ansible.builtin.include_tasks:
    file: tasks/configure_plugin_fleet_mirrors.yaml
    apply:
      tags: mirror
      environment:
        KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  when:
    - plugin.registries | default([]) | length > 0
    - plugin.operators | default([]) | length > 0
    - not (plugin.installOperators | default(true) | bool)
    - plugin.helm | default([]) | length == 0
    - disconnected | default(true) | bool
  tags: mirror

- name: "{{ plugin_name }} | Install plugin operators"
  vars:
    default_operator_source: "cs-{{ catalog_mirror }}"
  ansible.builtin.include_tasks:
    file: tasks/configure_operator.yaml
    apply:
      tags: operators
      environment:
        KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  loop: "{{ plugin.operators }}"
  loop_control:
    loop_var: operator
  when:
    - plugin.operators | default([]) | length > 0
    - plugin.installOperators | default(true)
  tags: operators

- name: "{{ plugin_name }} | Install plugin operators to fleet"
  ansible.builtin.include_tasks:
    file: tasks/configure_operators_fleet.yaml
    apply:
      tags: operators
      environment:
        KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  when:
    - plugin.operators | default([]) | length > 0
    - plugin.clusterSelector is defined
    - plugin.clusterSelector | length > 0
  tags: operators

- name: "{{ plugin_name }} | Run post-operators"
  ansible.builtin.include_tasks:
    file: "{{ plugin_dir }}/tasks/post-operators.yaml"
    apply:
      tags: post-operators
      environment:
        KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  when: lookup('ansible.builtin.fileglob', plugin_dir ~ '/tasks/post-operators.yaml') | length > 0
  tags: post-operators

- name: "{{ plugin_name }} | Deploy Helm charts"
  ansible.builtin.include_tasks:
    file: tasks/helm_deploy.yaml
    apply:
      tags: helm
      environment:
        KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  loop: "{{ plugin.helm }}"
  loop_control:
    loop_var: helm_chart
    label: "{{ helm_chart.release }}"
  when:
    - plugin.helm is defined
    - plugin.helm | length > 0
  tags: helm

- name: "{{ plugin_name }} | Run deploy"
  ansible.builtin.include_tasks:
    file: "{{ plugin_dir }}/tasks/deploy.yaml"
    apply:
      tags: deploy
      environment:
        KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  when: lookup('ansible.builtin.fileglob', plugin_dir ~ '/tasks/deploy.yaml') | length > 0
  tags: deploy

# Record the plugin in enabled_plugins so sync.sh re-mirrors its operator catalog
# and upgrade.yaml reconciles its operators. Only on the standalone day-2 path
# (register_enabled_plugin) and only for plugins whose operators install on the
# management cluster (installOperators != false, non-empty operators). Target the
# active global config selected by vars_file, matching common/load-vars.yaml.
- name: "{{ plugin_name }} | Record plugin in enabled_plugins"
  ansible.builtin.command:
    argv:
      - enclave
      - tools
      - add-enabled-plugin
      - --config
      - "{{ vars_file | default(playbook_dir ~ '/../config/global.yaml', true) }}"
      - --plugin
      - "{{ plugin.name }}"
  register: r_register_enabled_plugin
  changed_when: "'[UPDATE]' in r_register_enabled_plugin.stdout"
  when:
    - register_enabled_plugin | default(false) | bool
    - plugin.operators | default([]) | length > 0
    - plugin.installOperators | default(true)
  tags: deploy

- name: "{{ plugin_name }} | Run post-validate"
  ansible.builtin.include_tasks:
    file: "{{ plugin_dir }}/tasks/post-validate.yaml"
    apply:
      tags: post-validate
      environment:
        KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  when: lookup('ansible.builtin.fileglob', plugin_dir ~ '/tasks/post-validate.yaml') | length > 0
  tags: post-validate
