---
# After a MachineConfigPool rollout, wait for the hub Quay app to be serving again.
#
# The pool only tracks nodes: it reports Updated once every node is back, even if a pod
# evicted by the drains cannot be scheduled again. On LVMS the Quay app's volume is
# node-local, so the pod can only return to that node; if other evicted pods filled it,
# the pod stays Pending, the hub Quay route answers 503, and later steps that pull from
# it (the UpdateService graph image) time out with no hint of why. Waits up to 15
# minutes for a ready replica and otherwise fails naming the pods that are not running
# and why (e.g. their FailedScheduling message). No-op when the Quay app doesn't exist.

- name: Start the hub Quay wait clock
  ansible.builtin.set_fact:
    _quay_wait_deadline: "{{ now(utc=true).timestamp() | float + 900 }}"

# One 15-minute deadline across all attempts (each poll is bounded by --request-timeout).
- name: Wait for the hub Quay app to be ready after the rollout
  ansible.builtin.command:
    argv: ["{{ workingDir }}/bin/oc", get, deployment, registry-quay-app, -n, quay-enterprise,
           --ignore-not-found, -o, json, --request-timeout=30s]
  environment:
    KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
  register: r_quay_app_after_rollout
  changed_when: false
  failed_when: false
  retries: 120
  delay: 15
  timeout: 60
  until: >-
    (r_quay_app_after_rollout.rc | default(1) == 0
     and (r_quay_app_after_rollout.stdout | trim | length == 0
          or (r_quay_app_after_rollout.stdout | from_json).status.readyReplicas | default(0) | int > 0))
    or now(utc=true).timestamp() | float >= _quay_wait_deadline | float

- name: Report why the hub Quay app is not ready
  when: >-
    r_quay_app_after_rollout.rc | default(1) != 0
    or (r_quay_app_after_rollout.stdout | trim | length > 0
        and (r_quay_app_after_rollout.stdout | from_json).status.readyReplicas | default(0) | int == 0)
  block:
    - name: Get the hub Quay app pods
      ansible.builtin.command:
        argv: ["{{ workingDir }}/bin/oc", get, pods, -n, quay-enterprise,
               -l, quay-component=quay-app, -o, json, --request-timeout=30s]
      environment:
        KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
      register: r_quay_app_pods
      changed_when: false
      failed_when: false

    - name: Fail because the hub Quay app is not ready after the rollout
      vars:
        _pods: "{{ (r_quay_app_pods.stdout | from_json)['items'] if r_quay_app_pods.rc | default(1) == 0 else [] }}"
        _why: >-
          {%- set out = [] -%}
          {%- for p in _pods -%}
            {%- set cond = (p.status.conditions | default([])
                            | rejectattr('status', 'equalto', 'True') | list | first) | default({}) -%}
            {%- set _ = out.append(p.metadata.name ~ ' ' ~ p.status.phase | default('?')
                ~ (' on ' ~ p.spec.nodeName if p.spec.nodeName is defined else ' (not scheduled)')
                ~ (': ' ~ cond.type ~ ' ' ~ (cond.reason | default('')) ~ ' '
                   ~ (cond.message | default('') | regex_replace('\s+', ' ') | truncate(300))
                   if cond else '')) -%}
          {%- endfor -%}
          {{ out | join('; ') if out else 'no quay-app pods found' }}
      ansible.builtin.fail:
        msg: >-
          The hub Quay app (quay-enterprise/registry-quay-app) has no ready replica 15
          minutes after the MachineConfigPool rollout, so the hub Quay is not serving.
          Pods: {{ _why }}.
          {{ 'Could not read the Deployment: ' ~ (r_quay_app_after_rollout.stderr | default('') | trim | truncate(200))
             if r_quay_app_after_rollout.rc | default(1) != 0 else '' }}
