---
# Refresh only the CatalogSources published by this mirror invocation.
# OLM recreates these pods and pulls the current content of the catalog tag.

- name: Get pods for the mirrored CatalogSources
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: openshift-marketplace
    label_selectors:
      - "olm.catalogSource in ({{ mirrored_catalog_sources | join(',') }})"
  register: r_catalog_pods

# The plugin mirror snapshots pods after publishing and before applying sources.
# Pods created after that snapshot can pull the new tag on startup.
- name: Select catalog pods that still need a refresh
  ansible.builtin.set_fact:
    _catalog_pods_to_refresh: >-
      {{ r_catalog_pods.resources
         | selectattr('metadata.uid', 'in',
             catalog_pods_after_publish | default(r_catalog_pods.resources)
             | map(attribute='metadata.uid') | list)
         | list }}

- name: Delete catalog source pods to trigger refresh
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    name: "{{ item.metadata.name }}"
    namespace: openshift-marketplace
    delete_options:
      preconditions:
        uid: "{{ item.metadata.uid }}"
  loop: "{{ _catalog_pods_to_refresh }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  register: r_delete_catalog_pods
  retries: "{{ k8s_retries }}"
  delay: "{{ k8s_delay }}"
  until: r_delete_catalog_pods is success

- name: Wait for ready replacement pods for the mirrored CatalogSources
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: openshift-marketplace
    label_selectors:
      - "olm.catalogSource={{ mirrored_catalog_source }}"
    field_selectors:
      - "status.phase=Running"
  loop: "{{ mirrored_catalog_sources }}"
  loop_control:
    loop_var: mirrored_catalog_source
  register: r_catalog_pods_running
  retries: 30
  delay: 10
  until: >-
    r_catalog_pods_running.resources | default([])
    | rejectattr('metadata.uid', 'in', _catalog_pods_to_refresh | map(attribute='metadata.uid') | list)
    | rejectattr('metadata.deletionTimestamp', 'defined')
    | selectattr('status.conditions', 'defined')
    | map(attribute='status.conditions')
    | flatten
    | selectattr('type', 'equalto', 'Ready')
    | selectattr('status', 'equalto', 'True')
    | list | length > 0

- name: Wait for refreshed CatalogSources to be ready
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: CatalogSource
    namespace: openshift-marketplace
  register: r_refreshed_catalog_sources
  retries: 24
  delay: 10
  until: >-
    r_refreshed_catalog_sources.resources | default([])
    | selectattr('metadata.name', 'in', mirrored_catalog_sources)
    | selectattr('status', 'defined')
    | selectattr('status.connectionState', 'defined')
    | selectattr('status.connectionState.lastObservedState', 'defined')
    | selectattr('status.connectionState.lastObservedState', 'equalto', 'READY')
    | list | length == mirrored_catalog_sources | length
