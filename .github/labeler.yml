# Area labels - no prefix, based on file paths

deployment:
  - changed-files:
    - any-glob-to-any-file:
      - 'playbooks/0[1-7]-*.yaml'
      - 'playbooks/main.yaml'
      - 'ci/deployment/**/*'
      - 'ci/infrastructure/generate_*.sh'
      - 'Makefile'
      - 'defaults/**/*'
      - 'config/**/*'

ci-cd:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**/*'
      - 'ci/runners/**/*'

infrastructure:
  - changed-files:
    - any-glob-to-any-file:
      - 'ci/infrastructure/**/*'
      - 'ci/setup/**/*'
      - 'ci/cleanup/**/*'
      - 'src/enclave_ci/enclave_ci/environment/**/*'
      - 'playbooks/tasks/create_*.yaml'
      - 'playbooks/tasks/configure_*.yaml'
      - 'playbooks/tasks/provision_*.yaml'

validation:
  - changed-files:
    - any-glob-to-any-file:
      - 'schemas/**/*'
      - 'ci/verification/**/*'
      - 'validations.sh'
      - 'playbooks/tasks/validate_*.yaml'

operators:
  - changed-files:
    - any-glob-to-any-file:
      - 'operators/**/*'
      - 'playbooks/05-operators.yaml'
      - 'playbooks/tasks/*operator*.yaml'
      - 'playbooks/tasks/deploy_operator*.yaml'

utilities:
  - changed-files:
    - any-glob-to-any-file:
      - 'ci/lib/**/*'
      - 'ci/utils/**/*'

plugins:
  - changed-files:
    - any-glob-to-any-file:
      - 'plugins/**/*'
      - 'playbooks/tasks/*plugin*.yaml'
      - 'playbooks/deploy-plugin.yaml'
      - 'schemas/plugin.yaml'

diagnostics:
  - changed-files:
    - any-glob-to-any-file:
      - 'ci/diagnostics/**/*'
