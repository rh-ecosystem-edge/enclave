name: E2E ODF (Scheduled)

# Weekly ODF E2E test. Dispatches the disconnected E2E workflow with
# storage-plugin=odf so no cron-matching logic is needed (ODF is disconnected-only).
# It also adds the SNO managed cluster: this run already uses the large runner the
# SNO needs, so it gives the SNO path weekly coverage without another scheduled job.

on:
  schedule:
    # Run once a week
    - cron: '0 1 * * 3'

permissions:
  actions: write

jobs:
  dispatch-odf:
    name: Dispatch ODF E2E
    runs-on: [self-hosted, pr-validation-aws]
    timeout-minutes: 5
    steps:
      - name: Trigger E2E Disconnected with ODF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run e2e-disconnected.yml \
            --ref "${{ github.ref }}" \
            -f storage-plugin=odf \
            -f additional-sno-vm=true \
            -f send-slack-notification=true \
            -f workflow-display-name="E2E ODF" \
            -R "${{ github.repository }}"
          echo "Dispatched E2E Disconnected with ODF storage plugin and the SNO managed cluster" | tee -a $GITHUB_STEP_SUMMARY
