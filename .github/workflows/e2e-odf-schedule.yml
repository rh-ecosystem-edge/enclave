name: E2E ODF (Scheduled)

# Weekly ODF E2E test. Dispatches the disconnected E2E workflow with
# storage-plugin=odf so no cron-matching logic is needed (ODF is disconnected-only).

on:
  schedule:
    # Run daily at 05:00 UTC
    - cron: '0 5 * * *'

permissions:
  actions: write

jobs:
  dispatch-odf:
    name: Dispatch ODF E2E
    runs-on: [self-hosted, pr-validation-aws]
    timeout-minutes: 5
    steps:
      - name: Trigger E2E Disconnected with ODF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run e2e-disconnected.yml \
            --ref "${{ github.ref }}" \
            -f storage-plugin=odf \
            -f send-slack-notification=true \
            -f workflow-display-name="E2E ODF" \
            -R "${{ github.repository }}"
          echo "Dispatched E2E Disconnected with ODF storage plugin" | tee -a $GITHUB_STEP_SUMMARY
