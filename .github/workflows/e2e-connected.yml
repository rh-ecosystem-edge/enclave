name: E2E Connected

# Connected-mode E2E: fast deployment pulling from upstream registries.
#
# Thin wrapper that calls the reusable single-mode workflow e2e-deployment.yml
# with mode=connected. Runs nightly and on manual dispatch only — it is NOT run
# per PR or in the merge queue, since disconnected (e2e-disconnected.yml) already
# covers PR validation and running both modes on every PR gains little. Connected
# is still retried by e2e-spot-retry.yml independently. Callers that need a custom
# plugin chain (e.g. e2e-osac.yml) call e2e-deployment.yml directly, not this wrapper.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  schedule:
    # Run daily at 10:00 PM EST (03:00 UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      storage-plugin:
        description: 'Storage plugin to deploy (connected supports lvms or vast-csi)'
        required: true
        default: 'lvms'
        type: choice
        options:
          - lvms
          - vast-csi
      skip-cleanup:
        description: 'Skip cleanup after deployment (leave infrastructure running)'
        required: false
        type: boolean
        default: false
      send-slack-notification:
        description: 'Send Slack notification on completion'
        required: false
        type: boolean
        default: false
      enabled-plugins:
        description: 'Comma-separated list of plugins to deploy (default: storage plugin only)'
        required: false
        type: string
        default: ''
      aap-license-file:
        description: 'Path to AAP license file on the CI runner (required for OSAC deployments)'
        required: false
        type: string
        default: ''
      workflow-display-name:
        description: 'Display name prefix for Slack notifications (e.g., "E2E OSAC")'
        required: false
        type: string
        default: 'E2E Connected'
      osac-chart-version:
        description: 'OSAC Helm chart version to deploy (overrides plugin default)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  e2e:
    # TEMPORARY (OSAC-6416 PR): skip generic e2e on the spoke branch while iterating
    # on the dedicated E2E Spoke OpenShift AI run. Remove before merge.
    if: github.head_ref != 'feature/OSAC-6416-provision-spoke'
    uses: ./.github/workflows/e2e-deployment.yml
    with:
      mode: connected
      # Connected only runs on schedule/dispatch (no PR trigger), so always run
      # unconditionally rather than gating on changed files.
      force-run: true
      storage-plugin: ${{ inputs.storage-plugin || '' }}
      skip-cleanup: ${{ inputs.skip-cleanup || false }}
      send-slack-notification: ${{ inputs.send-slack-notification || false }}
      enabled-plugins: ${{ inputs.enabled-plugins || '' }}
      aap-license-file: ${{ inputs.aap-license-file || '' }}
      workflow-display-name: ${{ inputs.workflow-display-name || 'E2E Connected' }}
      osac-chart-version: ${{ inputs.osac-chart-version || '' }}
    secrets: inherit
