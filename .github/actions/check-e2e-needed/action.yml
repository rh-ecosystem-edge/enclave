name: Check if E2E is needed
description: >-
  Decide whether an E2E run should proceed, which storage plugin to use, and
  whether to add the SNO managed cluster.
  Shared by the e2e-connected and e2e-disconnected workflows via the single-mode
  reusable workflow, so the paths-filter and decision logic live in one place.

inputs:
  mode:
    description: 'Deployment mode (connected or disconnected)'
    required: true
  storage-plugin:
    description: 'Explicit storage plugin override (empty = auto-decide from changed files)'
    required: false
    default: ''
  force-run:
    description: 'Run regardless of changed files (set for schedule/dispatch/merge_group/callers)'
    required: false
    default: 'false'
  additional-sno-vm:
    description: 'Explicitly add the SNO managed cluster (true = always; false = auto-decide from changed files)'
    required: false
    default: 'false'

outputs:
  should_run:
    description: 'Whether the E2E job should run (true/false)'
    value: ${{ steps.decision.outputs.should_run }}
  storage_plugins:
    description: 'JSON array with the single storage plugin for the job matrix'
    value: ${{ steps.decision.outputs.storage_plugins }}
  additional_sno_vm:
    description: 'Whether to add the SNO managed cluster (true/false)'
    value: ${{ steps.decision.outputs.additional_sno_vm }}

runs:
  using: composite
  steps:
    # Positive filters, evaluated with the default "some" quantifier: the
    # filter matches when any changed file matches any of its patterns.
    # NOTE: ci/** is intentionally NOT listed here. A negated pattern
    # (e.g. !ci/docs/**) cannot be mixed into a "some"-quantified OR
    # list: under "some" a negated glob matches every path outside its
    # target, so a single unrelated file (even docs/*) would flip the whole
    # filter to true. The ci exclusion is handled by the dedicated
    # "every"-quantified step below.
    #
    # Skipped entirely when force-run is set (schedule/dispatch/merge_group and
    # reusable callers): the decision is already made, and paths-filter needs a
    # PR base to diff against.
    - name: Check if E2E-relevant files changed
      if: inputs.force-run != 'true'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          e2e:
            - 'playbooks/**'
            - 'src/**'
            - 'Makefile'
            - 'Makefile.ci'
            - 'config/**'
            - 'defaults/**'
            - 'schemas/**'
            - 'templates/**'
            - 'operators/**'
            - 'plugins/**'
            - 'files/**'
            - 'hack/**'
            - '.github/workflows/e2e-connected.yml'
            - '.github/workflows/e2e-disconnected.yml'
            - '.github/workflows/e2e-deployment.yml'
            - '.github/actions/check-e2e-needed/**'
            - 'ansible.cfg'
            - 'ansible_collections.txt'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'bootstrap.sh'
            - 'validations.sh'
            - 'setup_*.sh'
          odf:
            - 'plugins/odf/**'
            - 'ci/infrastructure/setup_ceph*'
          # The SNO job is the only one that discovers a real host and checks the
          # update service policy on a managed cluster, so discovery changes
          # (node-management plugin, phase 07 until it moves) and that policy trigger it too.
          sno:
            - 'ci/deployment/deploy_sno.sh'
            - 'ci/verification/verify_sno*.sh'
            - 'ci/infrastructure/vm_infra.py'
            - 'ci/infrastructure/generate_enclave_vars.sh'
            - 'plugins/node-management/**'
            - 'playbooks/07-configure-discovery.yaml'
            - 'operators/cincinnati-operator/**'

    # ci/** changes, each excluding its own documentation
    # (ci/docs/**). Uses the "every" quantifier so a file
    # matches only when it satisfies ALL patterns of a filter (under the tree
    # AND not under that tree's docs/). Each filter is true when at least one
    # such file changed, so a PR touching only docs (or no code at all) leaves
    # it false, while a PR mixing code and docs still triggers E2E.
    - name: Check if E2E-relevant ci scripts changed
      if: inputs.force-run != 'true'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter_ci
      with:
        predicate-quantifier: every
        filters: |
          ci:
            - 'ci/**'
            - '!ci/docs/**'

    - name: Make decision
      id: decision
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        INPUT_PLUGIN: ${{ inputs.storage-plugin }}
        INPUT_SNO: ${{ inputs.additional-sno-vm }}
        FORCE_RUN: ${{ inputs.force-run }}
        FILTER_E2E: ${{ steps.filter.outputs.e2e }}
        FILTER_CI: ${{ steps.filter_ci.outputs.ci }}
        FILTER_ODF: ${{ steps.filter.outputs.odf }}
        FILTER_SNO: ${{ steps.filter.outputs.sno }}
      run: |
        # should_run: force-run always runs; otherwise run when E2E-relevant
        # files or ci scripts changed. storage_plugins is a single-element JSON
        # array consumed by the job matrix.
        if [ "$FORCE_RUN" = "true" ]; then
          SHOULD_RUN=true
          REASON="forced run (schedule/dispatch/merge queue/reusable caller)"
        elif [ "$FILTER_E2E" = "true" ] || [ "$FILTER_CI" = "true" ]; then
          SHOULD_RUN=true
          REASON="E2E-relevant files changed"
        else
          SHOULD_RUN=false
          REASON="only documentation/config files changed"
        fi

        # Plugin: explicit override wins; else disconnected auto-picks odf when
        # ODF-relevant files changed (PR path only), otherwise lvms. Connected
        # never uses odf.
        if [ -n "$INPUT_PLUGIN" ]; then
          PLUGIN="$INPUT_PLUGIN"
        elif [ "$MODE" = "disconnected" ] && [ "$FORCE_RUN" != "true" ] && [ "$FILTER_ODF" = "true" ]; then
          PLUGIN="odf"
        else
          PLUGIN="lvms"
        fi
        if [ "$MODE" = "connected" ] && [ "$PLUGIN" = "odf" ]; then
          PLUGIN="lvms"
        fi

        # SNO managed cluster: explicit input wins; else disconnected adds it when
        # SNO-relevant files changed (PR path only). The SNO path is
        # disconnected-only (assisted-service is only configured there).
        if [ "$INPUT_SNO" = "true" ]; then
          SNO=true
        elif [ "$MODE" = "disconnected" ] && [ "$FORCE_RUN" != "true" ] && [ "$FILTER_SNO" = "true" ]; then
          SNO=true
        else
          SNO=false
        fi
        if [ "$MODE" = "connected" ]; then
          SNO=false
        fi

        echo "should_run=${SHOULD_RUN}" >> "$GITHUB_OUTPUT"
        echo "storage_plugins=[\"${PLUGIN}\"]" >> "$GITHUB_OUTPUT"
        echo "additional_sno_vm=${SNO}" >> "$GITHUB_OUTPUT"

        echo "E2E decision (${MODE}): should_run=${SHOULD_RUN} (${REASON}), storage plugin=${PLUGIN}, SNO managed cluster=${SNO}" \
          | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$SHOULD_RUN" = "false" ]; then
          echo "To run E2E anyway, use manual workflow_dispatch" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
