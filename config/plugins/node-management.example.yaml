##############################################################################
# NODE MANAGEMENT PLUGIN CONFIGURATION
# Copy to config/plugins/node-management.yaml and set discovery_hosts.
##############################################################################

nodeManagementConfig:
  # Leave empty when no hosts need to be discovered.
  discovery_hosts: []

  # Example:
  # discovery_hosts:
  #   - name: node01
  #     macAddress: 0c:c4:7a:d3:bc:30
  #     ipAddress: 192.168.2.21
  #     redfish: 100.64.1.21
  #     rootDisk: "/dev/disk/by-path/pci-0000:0011.4-ata-1.0"
  #     redfishUser: admin
  #     redfishPassword: YourSecurePassword
