---
##############################################################################
# OSAC PLUGIN CONFIGURATION TEMPLATE
# Instructions: Copy this file to 'config/plugins/osac.yaml' and set values.
# Required when the osac plugin is enabled.
##############################################################################

# Required: path to AAP license manifest.zip file on the Landing Zone.
# Obtain from: https://access.redhat.com/management/subscription_allocations
# osacAapLicenseFile: "/path/to/aap-license.zip"

# Optional: override OSAC Helm chart version (default from plugin defaults.yaml)
# osacChartVersion: "0.0.9-nightly.20260911.6d92ac5.82.1"

# Optional: enabled service profiles (default: [caas, bmaas])
# See docs/OSAC_DEPLOYMENT.md for valid profiles and prerequisites.
# The default pairs caas with bmaas (BMF scaled to zero, see note below) so it
# works without OpenShift Virtualization. Add 'vmaas' (with the cnv plugin) for
# VM-based compute.
#
# NOTE on 'bmaas' and bare-metal inventory backends (osacBcmEnabled /
# osacMetal3Enabled):
#   - A backend without 'bmaas' is rejected: BMF would not be deployed and the
#     backend config would be silently ignored.
#   - 'bmaas' without a backend IS allowed: BMF is scaled to zero replicas
#     (mirrors upstream caas-ci). Use this to satisfy the chart's
#     caas -> (vmaas|bmaas) requirement without real Metal3/BCM infrastructure.
#   - 'bmaas' with a backend deploys a functional BMF against that backend.
# osacProfilesList:
#   - caas
#   - bmaas
#   - ...

# Optional: create test users for initial UI/CLI access (default: false)
# osacTestUsers: true

# Optional: bring your own database
# osacBYODatabase: true
# osacDatabaseUrl: "postgres://user@host:5432/dbname?sslmode=require"

# Optional: override container images (chart defaults apply when unset)
# osac_images:
#   osac_operator: "ghcr.io/osac-project/osac-operator:v0.0.4"
#   fulfillment_service: "ghcr.io/osac-project/fulfillment-service:v0.0.4"
#   envoy: "docker.io/envoyproxy/envoy:v1.33.0"
#   aap_bootstrap: "ghcr.io/osac-project/osac-aap:v0.0.4"
#   cli: "quay.io/openshift/origin-cli:4.20.0"

# --- Networking (global.networking facade) ---
# Maps to Helm global.networking (osac-installer $defs/globalNetworking).
# See docs/OSAC_DEPLOYMENT.md and:
# https://github.com/osac-project/osac/blob/main/osac-installer/docs/network-backend.md
#
# Default (agentless / k8s_only) — also the plugin defaults:
# osacNetworking:
#   fabricManager: ""
#   k8sManager: "k8s_only"
#
# Netris fabric manager (inline password — preferred for wizard-driven deploys):
# osacNetworking:
#   fabricManager: "netris"
#   k8sManager: ""
#   netris:
#     controllerUrl: "https://ctl.netris.io"
#     credentials:
#       username: "netris"
#       password: "changeme"
#     siteId: "1"
#     tenantId: "1"
#     tenantName: "Admin"
#     # Optional facade extras (networkingNetris only):
#     # mgmtVpcId: "4"
#     # mgmtVpcName: "RH-Infra"
#     # resourceClassMap: '{"fc430": {"server_cluster_template_id": 89, "mgmt_interface": "ens4", "vpc_interfaces": ["ens13"]}}'
#   # Optional NetworkClass overrides (CIDRs / NAT / egressRules):
#   # networkClass:
#   #   defaults:
#   #     enableNatGateway: true
#
# Expert-only fields that used to live under flat osacNetris* (SSH keys, AWS
# keys, hosted-cluster domains, …) are NOT part of osacNetworking — configure
# them via aap.instanceGroups + global.expertOverrides.aap if needed.
#
# Optional DNS (still set on AAP IGs when Netris is selected):
# osacDnsClass: "dns.route53.dns"
# osacDnsZone: "example.com"

# --- BCM Inventory Backend ---
# Enable BCM (NVIDIA Base Command Manager) integration for bare metal fulfillment.
# Requires Metal3 for power management via BareMetalHost CRs.
# Enabling a backend also requires 'bmaas' in osacProfilesList (see note above).
# osacBcmEnabled: true

# Required when osacBcmEnabled is true:
# osacBcmUrl: "https://bcm-head:8081"
# osacBcmCert: |
#   -----BEGIN CERTIFICATE-----
#   ...
#   -----END CERTIFICATE-----
# osacBcmKey: |
#   -----BEGIN PRIVATE KEY-----
#   ...
#   -----END PRIVATE KEY-----
# osacBcmBmhNamespace: "openshift-machine-api"

# Optional BCM config:
# osacBcmCaCert: |
#   -----BEGIN CERTIFICATE-----
#   ...
#   -----END CERTIFICATE-----
# osacBcmInsecureSkipVerify: false
# osacBcmHostClass: "bcm"

# --- Metal3 Inventory Backend ---
# Enable Metal3 (BareMetalHost) integration for bare metal fulfillment.
# Uses locally-managed BareMetalHost CRs via the metal3.io API.
# NOTE: BCM and Metal3 are mutually exclusive — only one can be enabled.
# Enabling a backend also requires 'bmaas' in osacProfilesList (see note above).
# osacMetal3Enabled: true

# Required when osacMetal3Enabled is true:
# osacMetal3Namespace: "openshift-machine-api"

# Optional Metal3 config:
# osacMetal3HostClass: "metal3"
