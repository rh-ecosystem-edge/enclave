---
# Configuration of the ironic boot plugin (plugins/boot/ironic).
# Copy to config/plugins/boot/ironic.yaml (with mode 600) when any agent_hosts
# entry is booted by ironic (the default bootPlugin).

# BMC settings of each host booted by ironic, keyed by agent_hosts[].name.
# The keys must match exactly the names of the agent_hosts booted by ironic.
# driver selects the Ironic hardware type and the settings the host accepts;
# only redfish is supported.
hosts:
  YOUR_HOST_NAME_1:
    driver: redfish
    address: YOUR_BMC_ADDRESS           # host name or IP, optional :port and http(s):// (default https)
    username: YOUR_BMC_USER
    password: YOUR_BMC_PASSWORD
    # redfish:
    #   systemId: System.Embedded.1     # Optional. Only needed for multi-system BMCs
  YOUR_HOST_NAME_2:
    driver: redfish
    address: YOUR_BMC_ADDRESS
    username: YOUR_BMC_USER
    password: YOUR_BMC_PASSWORD
  YOUR_HOST_NAME_3:
    driver: redfish
    address: YOUR_BMC_ADDRESS
    username: YOUR_BMC_USER
    password: YOUR_BMC_PASSWORD
