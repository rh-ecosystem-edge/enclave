---
# Configuration of the ironic boot plugin (plugins/boot/ironic).
# Copy to config/plugins/boot/ironic.yaml (with mode 600) when any agent_hosts
# entry is booted by ironic (the default bootPlugin).

# BMC settings of each host booted by ironic, keyed by agent_hosts[].name.
# The keys must match exactly the names of the agent_hosts booted by ironic.
# driver is the Ironic hardware type of the host's BMC (only redfish is
# supported) and driverInfo its Ironic driver_info, with Ironic's keys in
# camelCase (redfishAddress for redfish_address).
hosts:
  YOUR_HOST_NAME_1:
    driver: redfish
    driverInfo:
      redfishAddress: YOUR_BMC_ADDRESS   # host name or IP, optional :port and http(s):// (default https)
      redfishUsername: YOUR_BMC_USER
      redfishPassword: YOUR_BMC_PASSWORD
      # redfishSystemId: /redfish/v1/Systems/System.Embedded.1   # Optional. Only for multi-system BMCs
      # redfishVerifyCA: true            # Optional. Verify the BMC TLS certificate (default false)
  YOUR_HOST_NAME_2:
    driver: redfish
    driverInfo:
      redfishAddress: YOUR_BMC_ADDRESS
      redfishUsername: YOUR_BMC_USER
      redfishPassword: YOUR_BMC_PASSWORD
  YOUR_HOST_NAME_3:
    driver: redfish
    driverInfo:
      redfishAddress: YOUR_BMC_ADDRESS
      redfishUsername: YOUR_BMC_USER
      redfishPassword: YOUR_BMC_PASSWORD
