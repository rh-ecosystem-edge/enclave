---
"$schema": "http://json-schema.org/draft-07/schema"
type: object
additionalProperties: false
properties:
  lvmsConfig:
    type: object
    description: LVMS storage configuration overrides for this deployment.
    additionalProperties: false
    properties:
      deviceSelector:
        type: object
        additionalProperties: false
        properties:
          optionalPaths:
            type: array
            description: List of device paths LVMS may use (omit to use all available).
            minItems: 1
            items:
              type: string
  lvmsQuayAppResources:
    type: object
    description: Override resource requests/limits for the managed Quay app container.
    additionalProperties: false
    properties:
      requests:
        type: object
        additionalProperties: false
        properties:
          cpu:
            "$ref": "#/definitions/k8sQuantity"
            description: CPU request for the Quay app container.
          memory:
            "$ref": "#/definitions/k8sQuantity"
            description: Memory request for the Quay app container.
      limits:
        type: object
        additionalProperties: false
        properties:
          cpu:
            "$ref": "#/definitions/k8sQuantity"
            description: CPU limit for the Quay app container.
          memory:
            "$ref": "#/definitions/k8sQuantity"
            description: Memory limit for the Quay app container.
