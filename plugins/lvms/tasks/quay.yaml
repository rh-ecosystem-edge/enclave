---
# LVMS-specific tasks for Quay: PVC, QuayRegistry, and deployment patch to mount registry storage.
# Included from operators/quay-operator/tasks.yaml via dynamic plugin include.

# spec.components is an atomic list, so a client-side apply replaces it wholesale
# and strips the components the Quay operator adds (clair, redis, route, mirror,
# monitoring, tls) — which it re-adds, bumping the generation every run. Merge our
# entries over the live list (by kind) instead, so steady-state re-runs are a no-op.
- name: Get current QuayRegistry (LVMS Backend)
  kubernetes.core.k8s_info:
    api_version: quay.redhat.com/v1
    kind: QuayRegistry
    name: registry
    namespace: quay-enterprise
  register: r_quay_registry_current

- name: Define desired QuayRegistry components (LVMS Backend)
  ansible.builtin.set_fact:
    quay_desired_components:
      - kind: horizontalpodautoscaler
        managed: "{{ quayBackend != 'LocalStorage' }}"
      - kind: objectstorage
        managed: false
      - kind: quay
        managed: true
        overrides:
          replicas: null
          resources: "{{ lvmsQuayAppResources }}"
      - kind: postgres
        managed: true
        overrides:
          resources:
            limits:
              cpu: 500m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 2Gi
      - kind: clairpostgres
        managed: true
        overrides:
          resources:
            limits:
              cpu: 500m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 2Gi

# combine() overrides matching kinds and appends the rest, preserving the
# operator's components and their order; an empty live list yields just ours.
- name: Merge desired components over the live QuayRegistry components (LVMS Backend)
  vars:
    live_components: "{{ r_quay_registry_current.resources[0].spec.components | default([]) }}"
    live_by_kind: "{{ dict(live_components | map(attribute='kind') | list | zip(live_components)) }}"
    desired_by_kind: "{{ dict(quay_desired_components | map(attribute='kind') | list | zip(quay_desired_components)) }}"
  ansible.builtin.set_fact:
    quay_merged_components: "{{ (live_by_kind | combine(desired_by_kind)).values() | list }}"

- name: Ensure QuayRegistry is present (LVMS Backend)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: quay.redhat.com/v1
      kind: QuayRegistry
      metadata:
        name: registry
        namespace: quay-enterprise
      spec:
        configBundleSecret: quay-config
        components: "{{ quay_merged_components }}"
  retries: 60
  delay: 10
  register: r_quay_lvms
  until: r_quay_lvms is succeeded

# The Quay app gets an LVMS PVC for its registry storage only with LocalStorage in
# disconnected mode; that volume is node-local and ties the app to one node.
- name: Set whether the Quay app uses an LVMS PVC
  ansible.builtin.set_fact:
    quay_app_on_lvms_pvc: "{{ quayBackend == 'LocalStorage' and disconnected | default(true) | bool }}"

- name: Quay LVMS storage (PVC and deployment patch)
  when: quay_app_on_lvms_pvc | bool
  block:
  - name: Wait for Quay app deployment to exist (LVMS)
    kubernetes.core.k8s_info:
      api_version: apps/v1
      kind: Deployment
      namespace: quay-enterprise
      name: registry-quay-app
    register: quay_app_deployment
    retries: 30
    delay: 10
    until: quay_app_deployment.resources | length > 0

  - name: Set quay container index for LVMS patch (first container is the app)
    ansible.builtin.set_fact:
      quay_container_index: 0
    when: quay_app_deployment.resources | default([]) | length > 0

  - name: Check if Quay app deployment already has registry-storage volume (LVMS)
    ansible.builtin.set_fact:
      quay_registry_storage_already_patched: "{{ quay_app_deployment.resources[0].spec.template.spec.volumes | selectattr('name', 'equalto', 'registry-storage') | list | length > 0 }}"
    when: quay_app_deployment.resources | default([]) | length > 0

  - name: Create LVMS PVC for Quay Storage
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: quay-storage-pvc
          namespace: quay-enterprise
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1000Gi
          storageClassName: "lvms-{{ lvmsDefaults.deviceClassName }}"

  - name: Patch Quay app deployment to mount registry storage PVC (LVMS)
    environment:
      KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
    ansible.builtin.shell: |
      {{ workingDir }}/bin/oc patch deployment registry-quay-app -n quay-enterprise --type=json -p='{{ quay_lvms_patch | to_json }}'
    vars:
      quay_lvms_patch:
        - op: add
          path: /spec/template/spec/volumes/-
          value:
            name: registry-storage
            persistentVolumeClaim:
              claimName: quay-storage-pvc
        - op: add
          path: /spec/template/spec/containers/{{ quay_container_index }}/volumeMounts/-
          value:
            name: registry-storage
            mountPath: /datastorage/registry
    when:
      - quay_app_deployment.resources | default([]) | length > 0
      - quay_container_index is defined
      - not (quay_registry_storage_already_patched | default(false))
    register: quay_patch_result

  # Applied independently of the registry-storage guard above so the selected strategy
  # still reaches an existing deployment on reruns. Replace the whole strategy object so
  # the operator's rollingUpdate sub-field (invalid under Recreate) is dropped. The guard
  # on the current type keeps this idempotent; the RollingUpdate default leaves the
  # operator-managed strategy untouched.
  - name: Set Quay app deployment update strategy to Recreate (LVMS)
    environment:
      KUBECONFIG: "{{ workingDir }}/ocp-cluster/auth/kubeconfig"
    ansible.builtin.shell: |
      {{ workingDir }}/bin/oc patch deployment registry-quay-app -n quay-enterprise --type=json -p='{{ quay_lvms_strategy_patch | to_json }}'
    vars:
      quay_lvms_strategy_patch:
        - op: replace
          path: /spec/strategy
          value:
            type: Recreate
    when:
      - quay_app_deployment.resources | default([]) | length > 0
      - (lvmsQuayAppUpdateStrategy | default('RollingUpdate')) == 'Recreate'
      - (quay_app_deployment.resources[0].spec.strategy.type | default('')) != 'Recreate'
    register: quay_strategy_patch_result

# Both Postgres databases, and the Quay app when it uses an LVMS PVC, sit on node-local
# LVMS volumes, so each can only run on one master. After a MachineConfig drain, other
# evicted pods can fill that master first and leave them Pending. A PriorityClass above
# the default (0), and below the platform classes, puts them first in the scheduling
# queue when their node returns and lets them preempt lower-priority pods there.
# The QuayRegistry overrides have no priority field, so patch the Deployments.
- name: Create the PriorityClass for node-pinned Quay pods (LVMS)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: scheduling.k8s.io/v1
      kind: PriorityClass
      metadata:
        name: enclave-quay-pinned
      value: 100000
      globalDefault: false
      preemptionPolicy: PreemptLowerPriority
      description: >-
        Quay pods pinned to one node by a node-local LVMS volume; lets them reclaim
        their node after a drain.
  register: r_quay_pinned_priorityclass
  retries: "{{ k8s_retries }}"
  delay: "{{ k8s_delay }}"
  until: r_quay_pinned_priorityclass is succeeded

- name: Wait for the node-pinned Quay deployments to exist (LVMS)
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: quay-enterprise
    name: "{{ item }}"
  loop: >-
    {{ (['registry-quay-app'] if quay_app_on_lvms_pvc | bool else [])
       + ['registry-quay-database', 'registry-clair-postgres'] }}
  register: r_quay_pinned_deployments
  retries: 30
  delay: 10
  until: r_quay_pinned_deployments.resources | length > 0

- name: Give the node-pinned Quay deployments the pinned PriorityClass (LVMS)
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    namespace: quay-enterprise
    name: "{{ item.item }}"
    definition:
      spec:
        template:
          spec:
            priorityClassName: enclave-quay-pinned
  loop: "{{ r_quay_pinned_deployments.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: (item.resources[0].spec.template.spec.priorityClassName | default('')) != 'enclave-quay-pinned'
  register: r_quay_pinned_patch
  retries: "{{ k8s_retries }}"
  delay: "{{ k8s_delay }}"
  until: r_quay_pinned_patch is succeeded
