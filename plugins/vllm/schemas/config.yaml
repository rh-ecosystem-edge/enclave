---
"$schema": "http://json-schema.org/draft-07/schema"
type: object
additionalProperties: false
required: [vllm]
properties:
  vllm:
    type: object
    additionalProperties: false
    required: [runtimeImage, modelPVC, modelPath, artifactIdentity]
    properties:
      runtimeImage:
        type: string
        pattern: '^[a-z0-9]+([.-][a-z0-9]+)+(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)+@sha256:[a-f0-9]{64}$'
      modelPVC:
        type: string
        maxLength: 63
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      modelPath:
        type: string
        description: Directory relative to the PVC root, containing model, config, tokenizer and chat template.
        pattern: '^[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*$'
      artifactIdentity:
        type: string
        description: Operator-recorded immutable artifact identity; not cryptographically verified by this addon.
        minLength: 1
        maxLength: 256
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:/@+-]*$'
      dtype:
        enum: [auto, half, bfloat16, float]
      maxModelLen:
        type: integer
        minimum: 128
        maximum: 131072
      maxNumSeqs:
        type: integer
        minimum: 1
        maximum: 32
      gpuCount:
        type: integer
        enum: [1, 2, 4, 8]
      cpu:
        type: string
        pattern: '^[1-9][0-9]*$'
      memory:
        type: string
        pattern: '^[1-9][0-9]*(Mi|Gi)$'
      shmSize:
        type: string
        pattern: '^[1-9][0-9]*(Mi|Gi)$'
      cacheSize:
        type: string
        pattern: '^[1-9][0-9]*(Mi|Gi)$'
      chatTemplateContentFormat:
        enum: [auto, string, openai]
      enableSmokeTest:
        type: boolean
