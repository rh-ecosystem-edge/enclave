---
- name: Validate serving defaults contract
  ansible.utils.validate:
    data: "{{ {'vllmDefaults': vllmDefaults} }}"
    criteria: "{{ lookup('ansible.builtin.file', plugin_dir ~ '/schemas/defaults.yaml') | from_yaml }}"
    engine: ansible.utils.jsonschema

- name: Validate serving configuration before mirroring or deployment
  ansible.utils.validate:
    data: >-
      {{ (lookup('ansible.builtin.file', r_plugin_user_config.stat.path) | from_yaml)
         if (r_plugin_user_config.stat.exists | default(false)) else {'vllm': vllm} }}
    criteria: "{{ lookup('ansible.builtin.file', plugin_dir ~ '/schemas/config.yaml') | from_yaml }}"
    engine: ansible.utils.jsonschema

- name: Resolve serving settings without changing operator configuration
  ansible.builtin.set_fact:
    vllm_settings: "{{ vllmDefaults | combine(vllm) }}"
