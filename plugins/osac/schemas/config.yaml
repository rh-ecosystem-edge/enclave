---
"$schema": "http://json-schema.org/draft-07/schema"
type: object
additionalProperties: false
properties:
  osacAapLicenseFile:
    type: string
    description: "Path to AAP license manifest.zip file on the Landing Zone"
  osacProfilesList:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [vmaas, caas, bmaas]
    description: "List of enabled service profiles: vmaas, caas, bmaas"
  osacChartVersion:
    type: string
    minLength: 1
    description: "OSAC Helm chart version to deploy (overrides default from defaults.yaml)"
  osacBYODatabase:
    type: boolean
    description: "Set to true to use an external database instead of the built-in dev postgres"
  osacDatabaseUrl:
    type: string
    description: >-
      Connection URL for external database. When provided with osacBYODatabase=true,
      post-operators.yaml creates the fulfillment-db secret from this value.
      If omitted, the user must pre-create the fulfillment-db secret manually.
  osac_images:
    type: object
    additionalProperties: false
    properties:
      osac_operator:
        type: string
        description: "Override for osac-operator image (e.g. ghcr.io/osac-project/osac-operator:v0.0.4)"
      fulfillment_service:
        type: string
        description: "Override for fulfillment-service image"
      envoy:
        type: string
        description: "Override for envoy sidecar image"
      aap_bootstrap:
        type: string
        description: "Override for AAP bootstrap image"
      cli:
        type: string
        description: "Override for OpenShift CLI image"
    description: >-
      Optional container image overrides. When unset, the Helm chart's
      built-in image references are used.
  osacTestUsers:
    type: boolean
    description: "Create test users in the Keycloak osac realm for initial UI/CLI access"
  osacDnsClass:
    type: string
    description: "Fully-qualified Ansible role name of the DNS driver"
    enum: ["dns.route53.dns"]
  osacDnsZone:
    type: string
    description: "DNS zone to operate in (defaults to EXTERNAL_ACCESS_BASE_DOMAIN)"
  osacNetrisEnabled:
    type: boolean
    description: "Enable Netris network backend for cluster/network fulfillment"
  osacNetrisControllerUrl:
    type: string
    description: "Netris controller API URL (e.g. https://ctl.netris.io)"
  osacNetrisUsername:
    type: string
    description: "Netris API username"
  osacNetrisPassword:
    type: string
    description: "Netris API password"
  osacNetrisSiteId:
    type: string
    description: "Netris site ID (integer as string)"
  osacNetrisTenantId:
    type: string
    description: "Netris tenant ID (integer as string)"
  osacNetrisTenantName:
    type: string
    description: "Netris tenant name"
  osacNetrisStepsCollection:
    type: string
    description: "Ansible steps collection for Netris (default: netris.steps)"
  osacNetrisMgmtVpcId:
    type: string
    description: "Management VPC ID in Netris"
  osacNetrisMgmtVpcName:
    type: string
    description: "Management VPC name in Netris"
  osacNetrisResourceClassMap:
    type: string
    description: "JSON dict mapping resource classes to Netris server cluster templates"
  osacNetrisSshBastionHost:
    type: string
    description: "SSH bastion hostname/IP for server management access"
  osacNetrisSshBastionUser:
    type: string
    description: "SSH bastion username"
  osacNetrisSshUser:
    type: string
    description: "SSH username for bare-metal servers (typically 'core')"
  osacNetrisMgmtRouteDestination:
    type: string
    description: "Management route CIDR (e.g. 10.8.0.0/30)"
  osacNetrisMgmtRouteGateway:
    type: string
    description: "Management route gateway IP"
  osacNetrisExternalAccessBaseDomain:
    type: string
    description: "DNS domain for cluster endpoints"
  osacNetrisExternalAccessSupportedBaseDomains:
    type: string
    description: "Comma-separated list of allowed base domains"
  osacNetrisExternalAccessApiInternalNetwork:
    type: string
    description: "Internal network type for API access (e.g. 'hypershift')"
  osacNetrisHostedClusterBaseDomain:
    type: string
    description: "Base domain for hosted clusters"
  osacNetrisHostedClusterControllerAvailabilityPolicy:
    type: string
    enum: [SingleReplica, HighlyAvailable]
    description: "Controller availability policy for hosted clusters"
  osacNetrisHostedClusterInfrastructureAvailabilityPolicy:
    type: string
    enum: [SingleReplica, HighlyAvailable]
    description: "Infrastructure availability policy for hosted clusters"
  osacNetrisAwsAccessKeyId:
    type: string
    description: "AWS access key for Route53 DNS management"
  osacNetrisAwsSecretAccessKey:
    type: string
    description: "AWS secret key for Route53 DNS management"
  osacNetrisSshKey:
    type: string
    description: "SSH private key for bare-metal server access"
  osacNetrisSshBastionKey:
    type: string
    description: "SSH private key for bastion host access"
  osacBcmEnabled:
    type: boolean
    description: "Enable BCM inventory backend for bare metal fulfillment"
  osacBcmUrl:
    type: string
    pattern: "^https://"
    minLength: 1
    description: "BCM head node API endpoint (e.g. https://bcm-head:8081)"
  osacBcmCert:
    type: string
    minLength: 1
    description: "PEM-encoded client certificate for BCM mTLS authentication"
  osacBcmKey:
    type: string
    minLength: 1
    description: "PEM-encoded client private key for BCM mTLS authentication"
  osacBcmCaCert:
    type: string
    minLength: 1
    description: "PEM-encoded CA certificate for verifying BCM server cert (optional)"
  osacBcmInsecureSkipVerify:
    type: boolean
    description: "Skip TLS verification of BCM server certificate (test environments only)"
  osacBcmHostClass:
    type: string
    minLength: 1
    description: "Host class identifier for BCM inventory (default: bcm)"
  osacBcmBmhNamespace:
    type: string
    minLength: 1
    description: "Namespace where BareMetalHost CRs are created for Metal3 power management"
required:
  - osacAapLicenseFile
dependencies:
  osacNetrisAwsAccessKeyId:
    - osacNetrisAwsSecretAccessKey
  osacNetrisAwsSecretAccessKey:
    - osacNetrisAwsAccessKeyId
allOf:
  - if:
      required:
        - osacNetrisEnabled
      properties:
        osacNetrisEnabled:
          const: true
    then:
      required:
        - osacNetrisControllerUrl
        - osacNetrisUsername
        - osacNetrisPassword
        - osacNetrisSiteId
        - osacNetrisTenantId
        - osacNetrisTenantName
  - if:
      required:
        - osacBcmEnabled
      properties:
        osacBcmEnabled:
          const: true
    then:
      required:
        - osacBcmUrl
        - osacBcmCert
        - osacBcmKey
        - osacBcmBmhNamespace
