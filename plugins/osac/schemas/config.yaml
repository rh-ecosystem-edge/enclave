---
"$schema": "http://json-schema.org/draft-07/schema"
type: object
additionalProperties: false
properties:
  osacAapLicenseFile:
    type: string
    description: "Path to AAP license manifest.zip file on the Landing Zone"
  osacProfilesList:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [vmaas, caas, bmaas]
    description: "List of enabled service profiles: vmaas, caas, bmaas"
  osacChartVersion:
    type: string
    minLength: 1
    description: "OSAC Helm chart version to deploy (overrides default from defaults.yaml)"
  osacBYODatabase:
    type: boolean
    description: "Set to true to use an external database instead of the built-in dev postgres"
  osacDatabaseUrl:
    type: string
    description: >-
      Connection URL for external database. When provided with osacBYODatabase=true,
      post-operators.yaml creates the fulfillment-db secret from this value.
      If omitted, the user must pre-create the fulfillment-db secret manually.
  osac_images:
    type: object
    additionalProperties: false
    properties:
      osac_operator:
        type: string
        description: "Override for osac-operator image (e.g. ghcr.io/osac-project/osac-operator:v0.0.4)"
      fulfillment_service:
        type: string
        description: "Override for fulfillment-service image"
      envoy:
        type: string
        description: "Override for envoy sidecar image"
      aap_bootstrap:
        type: string
        description: "Override for AAP bootstrap image"
      cli:
        type: string
        description: "Override for OpenShift CLI image"
    description: >-
      Optional container image overrides. When unset, the Helm chart's
      built-in image references are used.
  osacTestUsers:
    type: boolean
    description: "Create test users in the Keycloak osac realm for initial UI/CLI access"
  osacDnsClass:
    type: string
    description: "Fully-qualified Ansible role name of the DNS driver"
    enum: ["dns.route53.dns"]
  osacDnsZone:
    type: string
    description: "DNS zone to operate in (defaults to EXTERNAL_ACCESS_BASE_DOMAIN)"
  osacNetworking:
    type: object
    description: >-
      High-level networking profile passed through to Helm global.networking.
      Mirrors osac-installer values.schema.json $defs/globalNetworking.
    additionalProperties: false
    properties:
      fabricManager:
        type: string
        description: >-
          Fabric manager profile. Supported: empty string or netris.
          Reserved names cudn_net and vlan fail during Helm rendering.
        enum: ["", "netris", "cudn_net", "vlan"]
        default: ""
      k8sManager:
        type: string
        description: >-
          Kubernetes manager profile. Supported: empty string or k8s_only.
          Cannot be set together with a non-empty fabricManager.
        enum: ["", "k8s_only"]
        default: "k8s_only"
      netris:
        type: object
        description: Netris fabric manager configuration.
        additionalProperties: false
        properties:
          controllerUrl:
            type: string
            description: Netris controller API URL (HTTPS only).
            pattern: "^$|^https://[^/\\s:]+(:[0-9]+)?(/[^\\s]*)?$"
          credentials:
            type: object
            additionalProperties: false
            properties:
              username:
                type: string
              password:
                type: string
              externalSecret:
                type: boolean
                const: true
                description: >-
                  Use the externally managed netris-credentials Secret
                  (NETRIS_PASSWORD key) in the AAP namespace instead of an
                  inline password.
          siteId:
            type: string
          tenantId:
            type: string
          tenantName:
            type: string
          mgmtVpcId:
            type: string
          mgmtVpcName:
            type: string
          resourceClassMap:
            type: string
      networkClass:
        type: object
        description: >-
          Optional NetworkClass override. Empty or partial values are merged
          with the manager-specific default generated by Helm.
        additionalProperties: false
        properties:
          enabled:
            type: boolean
            default: true
          title:
            type: string
            minLength: 1
          description:
            type: string
          fabricManager:
            type: string
          k8sManager:
            type: string
          isDefault:
            type: boolean
            default: true
          defaults:
            type: object
            additionalProperties: false
            properties:
              virtualNetworkIPv4CIDR:
                type: string
                pattern: "^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)/(3[0-2]|[12]?[0-9])$"
              subnetIPv4CIDR:
                type: string
                pattern: "^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)/(3[0-2]|[12]?[0-9])$"
              enableNatGateway:
                type: boolean
              egressRules:
                type: array
                items:
                  type: object
                  required: [protocol]
                  additionalProperties: false
                  properties:
                    protocol:
                      type: string
                      enum: [PROTOCOL_TCP, PROTOCOL_UDP, PROTOCOL_ICMP, PROTOCOL_ALL]
                    ipv4Cidr:
                      type: string
                      pattern: "^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)/(3[0-2]|[12]?[0-9])$"
                    ipv6Cidr:
                      type: string
                      pattern: "^$|^[0-9a-fA-F:]+/(12[0-8]|1[01][0-9]|[1-9]?[0-9])$"
                    portFrom:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    portTo:
                      type: integer
                      minimum: 1
                      maximum: 65535
                  allOf:
                    - if:
                        properties:
                          protocol:
                            enum: [PROTOCOL_ICMP, PROTOCOL_ALL]
                        required: [protocol]
                      then:
                        properties:
                          portFrom:
                            not: {}
                          portTo:
                            not: {}
        allOf:
          - if:
              properties:
                k8sManager:
                  const: "k8s_only"
              required: [k8sManager]
            then:
              properties:
                fabricManager:
                  type: string
                  maxLength: 0
    allOf:
      - if:
          properties:
            fabricManager:
              const: netris
          required: [fabricManager]
        then:
          required: [netris]
          properties:
            k8sManager:
              enum: [""]
            netris:
              required: [controllerUrl, credentials, siteId, tenantId, tenantName]
              properties:
                controllerUrl:
                  minLength: 1
                  pattern: "^https://[^/\\s:]+(:[0-9]+)?(/[^\\s]*)?$"
                credentials:
                  required: [username]
                  oneOf:
                    - required: [password]
                    - required: [externalSecret]
                      properties:
                        externalSecret:
                          const: true
                  properties:
                    username:
                      minLength: 1
                    password:
                      minLength: 1
                    externalSecret:
                      type: boolean
                      const: true
                siteId:
                  minLength: 1
                tenantId:
                  minLength: 1
                tenantName:
                  minLength: 1
      - if:
          properties:
            k8sManager:
              const: k8s_only
          required: [k8sManager]
        then:
          properties:
            fabricManager:
              enum: [""]
  osacBcmEnabled:
    type: boolean
    description: "Enable BCM inventory backend for bare metal fulfillment"
  osacBcmUrl:
    type: string
    pattern: "^https://"
    minLength: 1
    description: "BCM head node API endpoint (e.g. https://bcm-head:8081)"
  osacBcmCert:
    type: string
    minLength: 1
    description: "PEM-encoded client certificate for BCM mTLS authentication"
  osacBcmKey:
    type: string
    minLength: 1
    description: "PEM-encoded client private key for BCM mTLS authentication"
  osacBcmCaCert:
    type: string
    minLength: 1
    description: "PEM-encoded CA certificate for verifying BCM server cert (optional)"
  osacBcmInsecureSkipVerify:
    type: boolean
    description: "Skip TLS verification of BCM server certificate (test environments only)"
  osacBcmHostClass:
    type: string
    minLength: 1
    description: "Host class identifier for BCM inventory (default: bcm)"
  osacBcmBmhNamespace:
    type: string
    minLength: 1
    description: "Namespace where BareMetalHost CRs are created for Metal3 power management"
  osacMetal3Enabled:
    type: boolean
    description: "Enable Metal3 inventory backend for bare metal fulfillment"
  osacMetal3Namespace:
    type: string
    minLength: 1
    description: "Namespace where BareMetalHost CRs are located"
  osacMetal3HostClass:
    type: string
    minLength: 1
    description: "Host class identifier for Metal3 inventory (default: metal3)"
required:
  - osacAapLicenseFile
allOf:
  - if:
      required:
        - osacBcmEnabled
      properties:
        osacBcmEnabled:
          const: true
    then:
      required:
        - osacBcmUrl
        - osacBcmCert
        - osacBcmKey
        - osacBcmBmhNamespace
      properties:
        osacMetal3Enabled:
          const: false
  - if:
      required:
        - osacMetal3Enabled
      properties:
        osacMetal3Enabled:
          const: true
    then:
      required:
        - osacMetal3Namespace
      properties:
        osacBcmEnabled:
          const: false
  # A bare-metal inventory backend (BCM or Metal3) requires bmaas in
  # osacProfilesList. This is an enclave-level constraint on enclave config vars
  # only (no coupling to the upstream chart schema, which enforces neither):
  #   - a backend without bmaas => BMF is not deployed and the backend config is
  #     silently ignored.
  # The reverse is NOT required: bmaas may be enabled without a backend. In that
  # case the template scales BMF to zero replicas (mirroring upstream caas-ci),
  # so it registers its API without crash-looping against absent BM infra. This
  # lets caas be satisfied via the chart's caas -> (vmaas|bmaas) requirement
  # without provisioning real Metal3/BCM infrastructure.
  - if:
      anyOf:
        - required:
            - osacBcmEnabled
          properties:
            osacBcmEnabled:
              const: true
        - required:
            - osacMetal3Enabled
          properties:
            osacMetal3Enabled:
              const: true
    then:
      required:
        - osacProfilesList
      properties:
        osacProfilesList:
          contains:
            const: bmaas
