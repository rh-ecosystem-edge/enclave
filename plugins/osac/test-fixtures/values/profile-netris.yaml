---
# Profile: Netris network backend (global.networking facade)
#
# Exercises osacNetworking → Helm global.networking plus AAP IG enable flags.
# Does not dual-write AAP NETRIS_* (chart derives those from the facade).
osac_profile_name: netris
osacNetworking:
  fabricManager: netris
  k8sManager: ""
  netris:
    controllerUrl: "https://netris.placeholder.example.com"
    credentials:
      username: admin
      password: placeholder
    siteId: "1"
    tenantId: "1"
    tenantName: default
    mgmtVpcId: "1"
    mgmtVpcName: mgmt
    resourceClassMap: '{"default": "default"}'
osacDnsClass: dns.route53.dns
osacDnsZone: placeholder.example.com
