---
# Profile: Netris Fabric Manager (provider networking enabled)
#
# Exercises osacNetworking.netris → AAP networkFulfillment/clusterFulfillment
# instance-group config and secret, plus the networkClass passthrough.
osac_profile_name: netris
osacNetworking:
  fabricManager: netris
  k8sManager: ""
  netris:
    controllerUrl: "https://netris.placeholder.example.com"
    credentials:
      username: admin
      password: placeholder
    siteId: "1"
    tenantId: "1"
    tenantName: default
    mgmtVpcId: "1"
    mgmtVpcName: mgmt
    resourceClassMap: '{"default": "default"}'
  networkClass:
    defaults:
      virtualNetworkIPv4CIDR: "172.16.0.0/16"
      subnetIPv4CIDR: "172.16.0.0/24"
      egressRules:
        - protocol: PROTOCOL_ALL
          ipv4Cidr: "0.0.0.0/0"
osacDnsClass: dns.route53.dns
osacDnsZone: placeholder.example.com
