---
# Add the Ironic settings of the Redfish hosts in _driver_hosts to
# _ironic_settings (see settings.yaml): the user's driver_info, without the
# password, plus the driver_info the plugin requires.

- name: Set Ironic settings of Redfish hosts
  ansible.builtin.set_fact:
    _ironic_settings: >-
      {{ _ironic_settings | combine({item.name: {
           'driver': 'redfish',
           'boot_interface': 'redfish-virtual-media',
           'password_field': 'redfish_password',
           'vmedia_detach': true,
           'driver_info': {'redfish_verify_ca': false}
             | combine(_driver_info | dict2items | rejectattr('key', 'equalto', 'redfish_password') | items2dict)
             | combine({'force_persistent_boot_device': 'Never'}),
         }}) }}
  vars:
    _driver_info: "{{ bootPluginConfig.hosts[item.name].driver_info }}"
  loop: "{{ _driver_hosts }}"
  loop_control:
    label: "{{ item.name }}"
