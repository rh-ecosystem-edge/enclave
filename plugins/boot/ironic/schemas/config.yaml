---
"$schema": "http://json-schema.org/draft-07/schema"
version: "1.0"
type: object

additionalProperties: false
properties:
  hosts:
    type: object
    description: BMC settings of each host booted by this plugin, keyed by agent_hosts[].name.
    minProperties: 1
    additionalProperties:
      "$ref": "#/definitions/host"
required:
  - hosts

definitions:
  host:
    type: object
    description: BMC settings of one host. driver selects the settings it accepts.
    properties:
      driver:
        type: string
        enum: [redfish]
        description: Ironic hardware type used to drive the BMC of the host.
    required:
      - driver
    allOf:
      - if:
          properties:
            driver:
              const: redfish
        then:
          "$ref": "#/definitions/redfishHost"
  redfishHost:
    type: object
    description: BMC settings of a host driven through Redfish.
    additionalProperties: false
    properties:
      driver:
        const: redfish
      address:
        type: string
        pattern: "^(https?://)?[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*(:(([1-9][0-9]{0,3})|([1-5][0-9]{4})|(6[0-4][0-9]{3})|(65[0-4][0-9]{2})|(655[0-2][0-9])|(6553[0-5])))?$"
        description: >-
          BMC address: host name or IPv4 address, with an optional port and an optional http://
          or https:// scheme (default https), e.g. bmc0.example.com, 192.168.1.1:8000 or
          http://192.168.1.1.
      username:
        type: string
        minLength: 1
        description: BMC user name.
      password:
        type: string
        minLength: 1
        description: BMC password.
      redfish:
        type: object
        description: Redfish-specific settings.
        additionalProperties: false
        properties:
          systemId:
            type: string
            minLength: 1
            description: >-
              Redfish System ID. Only needed for multi-system BMCs; auto-discovered when omitted.
    required:
      - address
      - username
      - password
