---
"$schema": "http://json-schema.org/draft-07/schema"
version: "1.0"
type: object

additionalProperties: false
properties:
  driver:
    type: string
    enum: [redfish]
    description: "Ironic hardware type used to drive the BMCs. Default: redfish."
  hosts:
    type: object
    description: BMC settings of each host booted by this plugin, keyed by agent_hosts[].name.
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
          pattern: "^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(:(([1-9][0-9]{0,3})|([1-5][0-9]{4})|(6[0-4][0-9]{3})|(65[0-4][0-9]{2})|(655[0-2][0-9])|(6553[0-5])))?$"
          description: BMC address, IPv4 with optional port (e.g. 192.168.1.1 or 192.168.1.1:8000).
        username:
          type: string
          minLength: 1
          description: BMC user name.
        password:
          type: string
          minLength: 1
          description: BMC password.
        systemId:
          type: string
          minLength: 1
          description: >-
            Redfish System ID. Only needed for multi-system BMCs; auto-discovered when omitted.
      required:
        - address
        - username
        - password
required:
  - hosts
