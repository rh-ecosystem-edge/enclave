---
- name: Display manual agent-host boot instructions
  ansible.builtin.debug:
    msg: |
      Manual boot plugin selected.

      Boot the following agent hosts from the generated Agent-Based Installer ISO:
      {% for agent_host in agent_hosts_to_provision %}
      - {{ agent_host.name }} (MAC {{ agent_host.macAddress }})
      {% endfor %}

      ISO on the Landing Zone: {{ agent_installer_iso_path }}
      Keep this playbook running. Enclave will continue after the rendezvous node
      is reachable and all configured agent hosts are known to Assisted Service.

- name: Wait for operator to start manual agent-host boot
  ansible.builtin.pause:
    prompt: >-
      Boot the listed hosts from the generated ISO, then press Enter to wait for
      host discovery and continue the installation.
